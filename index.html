                    }),
                    ...tiposEval.map((tipo,ti)=>{
                      const ex=getEx(alumno.id,temaItem,tipo);
                      const ap=ex.nota&&Number(ex.nota)>=7;
                      let celda;
                      if(ex.nota) celda=<span style={{fontWeight:800,color:ap?C.verde:C.rojo}}>{ex.nota}</span>;
                      else if(ex.estado==="ausente") celda=<span style={{color:C.rojo,fontWeight:700,fontSize:9}}>Aus</span>;
                      else if(ex.estado==="no_rindio") celda=<span style={{color:C.amarillo,fontWeight:700,fontSize:9}}>NR</span>;
                      else celda=<span style={{color:C.grisBorde}}>—</span>;
                      return(
                        <td key={`ev${temaItem}${ti}`} style={{...td,background:ap?"#e8f5ee":ex.estado?"#fff8e6":"inherit"}}>
                          {celda}
                        </td>
                      );
                    }),
                  ];
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
      <div style={{fontSize:10,color:C.gris,marginTop:8}}>
        Aus = Ausente · NR = No rindió · Aprobación: nota ≥ 7 · cl = clases del tema
      </div>
    </div>
  );
}


// ── PLANILLAS ────────────────────────────────────────────────────────────────
function Planillas({curso, cursoKey, registros, entregas, exNotas, exTipos, planillaActual, setPlanillaActual}){
  const temas = curso.temas;

  const td={padding:"6px 8px",borderRight:`1px solid ${C.grisBorde}`,borderBottom:`1px solid ${C.grisBorde}`,fontSize:10,verticalAlign:"middle",textAlign:"center",whiteSpace:"nowrap"};
  const th={...td,background:C.azul,color:C.blanco,fontWeight:700,fontSize:9,letterSpacing:0.5,textTransform:"uppercase"};
  const thSub={...th,background:"#1e5fa8"};
  const thTema={...th,background:C.azulMedio,fontSize:10};

  const BOTS=[
    {key:"asistencia",label:"📅 Asistencia"},
    {key:"desempeno",label:"⭐ Desempeño"},
    {key:"entregas",label:"📝 Entregas"},
    {key:"examenes",label:"📄 Exámenes"},
  ];

  // ── HELPERS ──
  function getClasesDelTema(temaItem){
    const claves=new Set();
    Object.keys(registros).forEach(k=>{ if(k.startsWith(`${cursoKey}__${temaItem}__`))claves.add(k); });
    return Array.from(claves).sort();
  }

  function getRegAlumno(alumnoId, clave){
    return registros[clave]?.[alumnoId]||{};
  }

  function getTiposEval(temaItem){
    const clave=`${cursoKey}__${temaItem}`;
    const g=exTipos&&exTipos[clave];
    return(Array.isArray(g)&&g.length>0)?[...g]:["Parcial"];
  }

  function getEx(alumnoId, temaItem, tipo){
    if(!exNotas||!temaItem||!tipo)return{};
    const clave=`${cursoKey}__${temaItem}__${tipo}`;
    return (exNotas[clave]&&exNotas[clave][alumnoId])||{};
  }

  function getEntregasSubtemas(temaItem){
    // Devuelve lista de {clave, subtema} para este tema
    const res=[];
    Object.keys(entregas).forEach(clave=>{
      if(!clave.startsWith(`${cursoKey}__${temaItem}`))return;
      const sub=clave.replace(`${cursoKey}__${temaItem}__`,"").replace(`${cursoKey}__${temaItem}`,"");
      res.push({clave,subtema:sub||"(sin subtema)"});
    });
    return res;
  }

  const btnStyle=(key)=>({
    padding:"8px 14px",borderRadius:10,fontWeight:700,fontSize:12,cursor:"pointer",
    border:`2px solid ${planillaActual===key?C.azul:C.grisBorde}`,
    background:planillaActual===key?C.azul:C.blanco,
    color:planillaActual===key?C.blanco:C.gris,
  });

  // ── PLANILLA ASISTENCIA ──
  function PlanillaAsistencia(){
    return(
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",minWidth:"100%",background:C.blanco,border:`1px solid ${C.grisBorde}`,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <thead>
            <tr>
              <th rowSpan={2} style={{...th,minWidth:130,textAlign:"left",paddingLeft:10,position:"sticky",left:0,zIndex:3,background:C.azul}}>Alumno</th>
              <th rowSpan={2} style={{...th,minWidth:60}}>Total</th>
              {temas.map(t=>{
                const clases=getClasesDelTema(t);
                return <th key={t} colSpan={Math.max(clases.length,1)} style={{...thTema,borderLeft:`3px solid ${C.azulClaro}`}}>{t}</th>;
              })}
            </tr>
            <tr>
              {temas.map(t=>{
                const clases=getClasesDelTema(t);
                if(clases.length===0)return <th key={t} style={{...thSub,borderLeft:`3px solid ${C.azulClaro}`}}>—</th>;
                return clases.map((clave,i)=>{
                  const fecha=clave.split("__")[2]||"";
                  const [y,m,d]=fecha.split("-");
                  return <th key={clave} style={{...thSub,minWidth:36,borderLeft:i===0?`3px solid ${C.azulClaro}`:undefined}}>{d}/{m}</th>;
                });
              })}
            </tr>
          </thead>
          <tbody>
            {curso.alumnos.map((alumno,i)=>{
              const bg=i%2===0?C.blanco:"#f8fafc";
              // Calcular total
              let totP=0,totC=0;
              temas.forEach(t=>getClasesDelTema(t).forEach(clave=>{
                const r=getRegAlumno(alumno.id,clave);
                if(r.presencia){totC++;if(r.presencia==="P")totP++;}
              }));
              const pct=totC>0?Math.round((totP/totC)*100):null;
              return(
                <tr key={alumno.id} style={{background:bg}}>
                  <td style={{...td,textAlign:"left",fontWeight:700,fontSize:11,paddingLeft:10,position:"sticky",left:0,background:bg,zIndex:1}}>{alumno.nombre}</td>
                  <td style={{...td,fontWeight:700,color:pct===null?C.gris:pct>=75?C.verde:C.rojo}}>
                    {pct!==null?`${pct}%`:"—"}
                    {totC>0&&<div style={{fontSize:8,color:C.gris}}>{totP}/{totC}</div>}
                  </td>
                  {temas.map(t=>{
                    const clases=getClasesDelTema(t);
                    if(clases.length===0)return <td key={t} style={{...td,borderLeft:`3px solid ${C.azulClaro}`}}><span style={{color:C.grisBorde}}>—</span></td>;
                    return clases.map((clave,ci)=>{
                      const r=getRegAlumno(alumno.id,clave);
                      const p=r.presencia;
                      const bg2=p==="P"?C.verdeBg:p==="A"?C.rojoBg:p==="J"?C.amarilloBg:"inherit";
                      const color=p==="P"?C.verde:p==="A"?C.rojo:p==="J"?C.amarillo:C.grisBorde;
                      return <td key={clave} style={{...td,background:bg2,borderLeft:ci===0?`3px solid ${C.azulClaro}`:undefined}}>
                        <span style={{fontWeight:700,color}}>{p==="P"?"P":p==="A"?"A":p==="J"?"J":"—"}</span>
                      </td>;
                    });
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{fontSize:10,color:C.gris,marginTop:8}}>P = Presente · A = Ausente · J = Justificada</div>
      </div>
    );
  }

  // ── PLANILLA DESEMPEÑO ──
  function PlanillaDesempeno(){
    return(
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",minWidth:"100%",background:C.blanco,border:`1px solid ${C.grisBorde}`,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <thead>
            <tr>
              <th rowSpan={2} style={{...th,minWidth:130,textAlign:"left",paddingLeft:10,position:"sticky",left:0,zIndex:3,background:C.azul}}>Alumno</th>
              {temas.map(t=>{
                const clases=getClasesDelTema(t);
                return <th key={t} colSpan={Math.max(clases.length,1)} style={{...thTema,borderLeft:`3px solid ${C.azulClaro}`}}>{t}</th>;
              })}
            </tr>
            <tr>
              {temas.map(t=>{
                const clases=getClasesDelTema(t);
                if(clases.length===0)return <th key={t} style={{...thSub,borderLeft:`3px solid ${C.azulClaro}`}}>—</th>;
                return clases.map((clave,i)=>{
                  const fecha=clave.split("__")[2]||"";
                  const [y,m,d]=fecha.split("-");
                  return <th key={clave} style={{...thSub,minWidth:36,borderLeft:i===0?`3px solid ${C.azulClaro}`:undefined}}>{d}/{m}</th>;
                });
              })}
            </tr>
          </thead>
          <tbody>
            {curso.alumnos.map((alumno,i)=>{
              const bg=i%2===0?C.blanco:"#f8fafc";
              return(
                <tr key={alumno.id} style={{background:bg}}>
                  <td style={{...td,textAlign:"left",fontWeight:700,fontSize:11,paddingLeft:10,position:"sticky",left:0,background:bg,zIndex:1}}>{alumno.nombre}</td>
                  {temas.map(t=>{
                    const clases=getClasesDelTema(t);
                    if(clases.length===0)return <td key={t} style={{...td,borderLeft:`3px solid ${C.azulClaro}`}}><span style={{color:C.grisBorde}}>—</span></td>;
                    return clases.map((clave,ci)=>{
                      const r=getRegAlumno(alumno.id,clave);
                      const d=r.desempeno;
                      const color=d==="+"?C.verde:d==="-"?C.rojo:d==="="?C.azulMedio:C.grisBorde;
                      const bg2=d==="+"?C.verdeBg:d==="-"?C.rojoBg:d==="="?C.azulClaro:"inherit";
                      return <td key={clave} style={{...td,background:bg2,borderLeft:ci===0?`3px solid ${C.azulClaro}`:undefined}}>
                        <span style={{fontWeight:800,color}}>{d||"—"}</span>
                      </td>;
                    });
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{fontSize:10,color:C.gris,marginTop:8}}>+ = Bien · − = No trabajó · = = Normal</div>
      </div>
    );
  }

  // ── PLANILLA ENTREGAS ──
  function PlanillaEntregas(){
    return(
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",minWidth:"100%",background:C.blanco,border:`1px solid ${C.grisBorde}`,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <thead>
            <tr>
              <th style={{...th,minWidth:130,textAlign:"left",paddingLeft:10,position:"sticky",left:0,zIndex:3}}>Alumno</th>
              {temas.map(t=>{
                const subs=getEntregasSubtemas(t);
                return <th key={t} colSpan={Math.max(subs.length*2,1)} style={{...thTema,borderLeft:`3px solid ${C.azulClaro}`}}>{t}</th>;
              })}
            </tr>
            <tr>
              {temas.map(t=>{
                const subs=getEntregasSubtemas(t);
                if(subs.length===0)return <th key={t} style={{...thSub,borderLeft:`3px solid ${C.azulClaro}`}}>—</th>;
                return subs.map(({clave,subtema},si)=>([
                  <th key={`t${clave}`} style={{...thSub,minWidth:44,borderLeft:si===0?`3px solid ${C.azulClaro}`:undefined,fontSize:8}}>{subtema.length>10?subtema.substring(0,9)+"…":subtema} T</th>,
                  <th key={`tp${clave}`} style={{...thSub,minWidth:44,background:"#6b21a8",fontSize:8}}>{subtema.length>10?subtema.substring(0,9)+"…":subtema} TP</th>,
                ]));
              })}
            </tr>
          </thead>
          <tbody>
            {curso.alumnos.map((alumno,i)=>{
              const bg=i%2===0?C.blanco:"#f8fafc";
              return(
                <tr key={alumno.id} style={{background:bg}}>
                  <td style={{...td,textAlign:"left",fontWeight:700,fontSize:11,paddingLeft:10,position:"sticky",left:0,background:bg,zIndex:1}}>{alumno.nombre}</td>
                  {temas.map(t=>{
                    const subs=getEntregasSubtemas(t);
                    if(subs.length===0)return <td key={t} style={{...td,borderLeft:`3px solid ${C.azulClaro}`}}><span style={{color:C.grisBorde}}>—</span></td>;
                    return subs.map(({clave,subtema},si)=>{
                      const e=entregas[clave]?.[alumno.id]||{};
                      return([
                        <td key={`t${clave}`} style={{...td,borderLeft:si===0?`3px solid ${C.azulClaro}`:undefined}}>
                          {e.tarea?<span style={{fontWeight:700,color:C.azul}}>{e.tarea}</span>:<span style={{color:C.grisBorde}}>—</span>}
                        </td>,
                        <td key={`tp${clave}`} style={{...td}}>
                          {e.tp!=null?<span style={{fontWeight:700,color:C.purpura}}>{e.tp}%</span>:<span style={{color:C.grisBorde}}>—</span>}
                        </td>,
                      ]);
                    });
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{fontSize:10,color:C.gris,marginTop:8}}>T = Tarea (M/R/B-/B) · TP = Trabajo Práctico (%)</div>
      </div>
    );
  }

  // ── PLANILLA EXÁMENES ──
  function PlanillaExamenes(){
    return(
      <div style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",minWidth:"100%",background:C.blanco,border:`1px solid ${C.grisBorde}`,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <thead>
            <tr>
              <th style={{...th,minWidth:130,textAlign:"left",paddingLeft:10,position:"sticky",left:0,zIndex:3}}>Alumno</th>
              {temas.map(t=>{
                const tipos=getTiposEval(t);
                return <th key={t} colSpan={tipos.length} style={{...thTema,borderLeft:`3px solid ${C.azulClaro}`}}>{t}</th>;
              })}
            </tr>
            <tr>
              {temas.map(t=>{
                const tipos=getTiposEval(t);
                return tipos.map((tipo,ti)=>(
                  <th key={`${t}${tipo}`} style={{...thSub,minWidth:52,borderLeft:ti===0?`3px solid ${C.azulClaro}`:undefined,background:ti===0?"#1e4d7b":"#163d61"}}>
                    {tipo.length>8?tipo.substring(0,7)+"…":tipo}
                  </th>
                ));
              })}
            </tr>
          </thead>
          <tbody>
            {curso.alumnos.map((alumno,i)=>{
              const bg=i%2===0?C.blanco:"#f8fafc";
              const aprobaTodo=temas.every(t=>{
                const tipos=getTiposEval(t);
                return tipos.some(tipo=>{const ex=getEx(alumno.id,t,tipo);return ex.nota&&Number(ex.nota)>=7;});
              });
              return(
                <tr key={alumno.id} style={{background:aprobaTodo?"#f0faf4":bg}}>
                  <td style={{...td,textAlign:"left",fontWeight:700,fontSize:11,paddingLeft:10,position:"sticky",left:0,background:aprobaTodo?"#f0faf4":bg,zIndex:1}}>
                    <div>{alumno.nombre}</div>
                    {aprobaTodo&&<div style={{fontSize:8,color:C.verde,fontWeight:800}}>✅ Todo aprobado</div>}
                  </td>
                  {temas.map(t=>{
                    const tipos=getTiposEval(t);
                    return tipos.map((tipo,ti)=>{
                      const ex=getEx(alumno.id,t,tipo);
                      const ap=ex.nota&&Number(ex.nota)>=7;
                      let celda;
                      if(ex.nota) celda=<span style={{fontWeight:800,color:ap?C.verde:C.rojo}}>{ex.nota}</span>;
                      else if(ex.estado==="ausente") celda=<span style={{color:C.rojo,fontWeight:700,fontSize:9}}>Aus</span>;
                      else if(ex.estado==="no_rindio") celda=<span style={{color:C.amarillo,fontWeight:700,fontSize:9}}>NR</span>;
                      else celda=<span style={{color:C.grisBorde}}>—</span>;
                      return <td key={`${t}${tipo}`} style={{...td,borderLeft:ti===0?`3px solid ${C.azulClaro}`:undefined,background:ap?"#e8f5ee":ex.estado?"#fff8e6":"inherit"}}>{celda}</td>;
                    });
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
        <div style={{fontSize:10,color:C.gris,marginTop:8}}>Aus = Ausente · NR = No rindió · Aprobación: nota ≥ 7</div>
      </div>
    );
  }

  return(
    <div>
      {/* SELECTOR DE PLANILLA */}
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {BOTS.map(b=>(
          <button key={b.key} onClick={()=>setPlanillaActual(b.key)} style={btnStyle(b.key)}>{b.label}</button>
        ))}
      </div>

      {planillaActual==="asistencia"&&<PlanillaAsistencia/>}
      {planillaActual==="desempeno"&&<PlanillaDesempeno/>}
      {planillaActual==="entregas"&&<PlanillaEntregas/>}
      {planillaActual==="examenes"&&<PlanillaExamenes/>}
    </div>
  );
}

// ── VINCULAR CLASSROOM ────────────────────────────────────────────────────────
function VincularClassroom({cursoKey,cursoNombre,idActual,onVincular,onCancelar}){
  const [inputId,setInputId]=useState(idActual);
  return(
    <div>
      <div style={{fontSize:12,color:C.gris,marginBottom:12}}>
        Ingresá el ID del curso de Google Classroom para <strong>{cursoNombre}</strong>.
      </div>
      <div style={{background:C.azulClaro,borderRadius:8,padding:"10px 14px",fontSize:11,color:C.azulMedio,marginBottom:14,lineHeight:1.7}}>
        <strong>¿Cómo encontrar el ID?</strong><br/>
        Abrí el curso en Google Classroom.<br/>
        Mirá la URL: <code style={{background:"rgba(0,0,0,0.08)",padding:"1px 4px",borderRadius:3}}>classroom.google.com/c/<strong>ESTE_ES_EL_ID</strong></code><br/>
        Copiá la parte que está después de <code>/c/</code>
      </div>
      <Lbl>ID del curso en Classroom</Lbl>
      <input value={inputId} onChange={e=>setInputId(e.target.value)}
        placeholder="Ej: abc123xyz456"
        style={{width:"100%",height:40,padding:"0 12px",border:`1px solid ${C.grisBorde}`,borderRadius:8,fontSize:13,outline:"none",boxSizing:"border-box",marginBottom:14,fontFamily:"monospace"}}/>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>onVincular(inputId.trim())}
          style={{flex:2,padding:"12px",background:C.azul,color:C.blanco,border:"none",borderRadius:9,fontSize:13,fontWeight:800,cursor:"pointer"}}>
          {inputId.trim()?"✓ Vincular":"Guardar sin ID"}
        </button>
        <button onClick={onCancelar}
          style={{flex:1,padding:"12px",background:C.fondo,border:"none",borderRadius:9,fontSize:13,color:C.gris,fontWeight:700,cursor:"pointer"}}>
          Cancelar
        </button>
      </div>
      {idActual&&(
        <button onClick={()=>onVincular("")}
          style={{width:"100%",padding:"10px",background:"none",border:`1px solid ${C.rojo}`,borderRadius:9,fontSize:12,color:C.rojo,cursor:"pointer",marginTop:8}}>
          Desvincular este curso
        </button>
      )}
    </div>
  );
}

  async function corregirConRubrica(){
    if(!habilPDF){setErrCorreccion("Subí primero el PDF del examen.");return;}
    if(!exClaveEval){setErrCorreccion("Seleccioná un tema y tipo de evaluación.");return;}
    setCorrigiendo(true);setErrCorreccion("");
    try{
      const b64Exam=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(habilPDF);});
      let b64Rubrica=null;
      if(rubricaPDF){
        b64Rubrica=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(rubricaPDF);});
      }
      const alumnosLista=curso.alumnos.map(a=>a.nombre).join(", ");
      const content_parts=[];
      content_parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:b64Exam}});
      if(b64Rubrica)content_parts.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:b64Rubrica}});
      content_parts.push({type:"text",text:`Sos el asistente corrector del Prof. Seré, Matemáticas, Colegio Los Molinos.
Tenés${b64Rubrica?" la rúbrica de corrección y":" (sin rúbrica —"} el examen escaneado de "${exTema}" (${exTipoActual}) del curso ${curso.nombre}.
${b64Rubrica?"Usá la rúbrica para determinar la nota de cada alumno.":"Evaluá el desempeño general de cada alumno y sugerí una nota del 1 al 10 considerando la escala: 7 = aprobado (70% de los contenidos)."}
Lista de alumnos del curso: ${alumnosLista}.
Para CADA alumno que encuentres en el examen, asigná una nota del 1 al 10 (puede ser con decimales como 7.5) y una justificación breve (1-2 oraciones) explicando por qué esa nota.
Si un alumno no está en el examen, no lo incluyas.
Respondé ÚNICAMENTE con JSON sin markdown:
{"correcciones":[{"nombre":"APELLIDO, Nombre","nota":7.5,"justificacion":"Resolvió correctamente los ejercicios 1 y 2, con errores menores en el 3."}]}`});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:8000,messages:[{role:"user",content:content_parts}]})
      });
      const data=await resp.json();
      const txt=data.content?.find(b=>b.type==="text")?.text||"";
      const jm=txt.match(/\{[\s\S]*\}/);
      if(!jm)throw new Error("No se obtuvo respuesta válida. Verificá que el PDF sea legible.");
      const resultado=JSON.parse(jm[0]);
      if(!resultado.correcciones?.length)throw new Error("No se detectaron alumnos en el examen.");
      // Mapear correcciones a ids de alumnos
      function normN(n){return n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s]/g,"").trim();}
      function levD(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
      const nuevasSug={};
      resultado.correcciones.forEach(corr=>{
        const alumno=curso.alumnos.find(a=>{
          const na=normN(a.nombre),nb=normN(corr.nombre);
          if(na===nb)return true;
          if(levD(na,nb)<=3)return true;
          const pa=na.split(" ")[0],pb=nb.split(" ")[0];
          return pa.length>3&&pb.length>3&&levD(pa,pb)<=2;
        });
        if(alumno)nuevasSug[alumno.id]={nota:corr.nota,justificacion:corr.justificacion};
      });
      setSugerencias(prev=>({...prev,[exClaveEval]:nuevasSug}));
      setErrCorreccion("");
    }catch(e){
      setErrCorreccion("Error: "+e.message);
    }
    setCorrigiendo(false);
  }

  async function callAppsScript(payload){
    if(!appsScriptUrl.trim())throw new Error("Configurá la URL del Apps Script primero.");
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6",max_tokens:1000,
        system:`Sos un agente que hace llamadas HTTP. Tu única tarea es hacer un fetch POST a la URL indicada con el payload JSON y devolver la respuesta. Respondé SOLO con el JSON de la respuesta, sin texto adicional.`,
        messages:[{role:"user",content:`Hacé un fetch POST a esta URL: ${appsScriptUrl}
Con este body JSON: ${JSON.stringify(payload)}
Headers: Content-Type: application/json
Devolvé SOLO el JSON de respuesta.`}],
        tools:[{type:"web_search_20250305",name:"web_search"}]
      })
    });
    const data=await resp.json();
    const txt=data.content?.find(b=>b.type==="text")?.text||"{}";
    const jm=txt.match(/\{[\s\S]*\}/);
    return jm?JSON.parse(jm[0]):{ok:false,error:"Sin respuesta"};
  }

  async function publicarEnClassroom(courseId, cuerpo){

              <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"8px 12px",background:C.azulClaro,border:`1px solid ${C.azulMedio}`,borderRadius:7,fontSize:11,color:C.azul,fontWeight:700,cursor:"pointer",marginBottom:10}}>
                📂 Cargar desde Excel / CSV (Nombre, Email — una fila por tutor)
                <input type="file" accept=".xlsx,.xls,.csv,.txt" style={{display:"none"}} onChange={async e=>{
                  const f=e.target.files[0];if(!f)return;
                  const txt=await f.text();
                  const lineas=txt.split(/\r?\n/).filter(l=>l.trim().length>2);
                  const nuevos=[];
                  lineas.forEach(l=>{
                    const parts=l.split(/[,;|\t]/).map(p=>p.replace(/"/g,"").trim());
                    const nombre=parts[0]||"";
                    const email=parts.find(p=>p.includes("@"))||parts[1]||"";
                    if(nombre.length>1)nuevos.push({id:Date.now()+Math.random(),nombre,email});
                  });
                  if(nuevos.length>0)setTutores(prev=>[...prev,...nuevos]);
                  e.target.value="";
                }}/>
              </label>
              <Lbl>O agregar uno por uno</Lbl>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                <input value={nuevoTutorNombre} onChange={e=>setNuevoTutorNombre(e.target.value)}
                  placeholder="Nombre completo"
                  style={{flex:1,height:34,padding:"0 10px",border:`1px solid ${C.grisBorde}`,borderRadius:7,fontSize:12,outline:"none"}}/>
              </div>
              <div style={{display:"flex",gap:8}}>
                <input type="email" value={nuevoTutorEmail} onChange={e=>setNuevoTutorEmail(e.target.value)}

                  if(!nuevoTutorNombre.trim())return;

                  setNuevoTutorNombre("");setNuevoTutorEmail("");
                }} style={{padding:"0 14px",background:C.azul,color:C.blanco,border:"none",borderRadius:7,fontWeight:700,fontSize:12,cursor:"pointer"}}>
                  Agregar

            {tutores.length===0&&<div style={{fontSize:12,color:C.gris,fontStyle:"italic",marginBottom:12}}>Sin tutores cargados todavía.</div>}

                      <div style={{display:"flex",gap:6}}>

                        <button onClick={()=>setTutorEditId(null)}
                          style={{padding:"0 10px",background:C.fondo,border:`1px solid ${C.grisBorde}`,borderRadius:6,fontSize:12,cursor:"pointer"}}>✕</button>
                      </div>
                    </div>

                        <div style={{fontSize:11,color:C.gris}}>{t.email||"Sin email"}</div>

                      <button onClick={()=>{setTutorEditId(t.id);setTutorEditNombre(t.nombre);setTutorEditEmail(t.email);}}

                      <button onClick={()=>setTutores(prev=>prev.filter(x=>x.id!==t.id))}
                        style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:C.rojo}}>🗑</button>
                    </div>
                  )}
                </div>
              ))}
            </div>
            <button onClick={()=>{setModalTutores(false);setTutorEditId(null);}}
              style={{width:"100%",padding:"13px",background:C.fondo,border:"none",borderRadius:10,fontSize:14,fontWeight:700,color:C.gris,cursor:"pointer"}}>
              Cerrar

          </div>
        </div>
      )}
    </div>
  );

  return(
    <div style={{fontFamily:"system-ui,sans-serif",fontSize:13,color:C.texto,minHeight:"100vh",background:C.fondo,paddingBottom:20}}>
      {/* HEADER */}
      <div style={{background:C.azul,padding:"14px 16px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <button onClick={()=>setCursoKey(null)} style={{background:"none",border:"none",color:"#7eb8e8",cursor:"pointer",fontSize:20,padding:0}}>←</button>
          <div style={{flex:1,textAlign:"center"}}>
            <div style={{fontSize:18,fontWeight:800,color:C.blanco}}>{curso.nombre}</div>
            {editFecha?<input type="date" value={fecha} onChange={e=>{setFecha(e.target.value);setEditFecha(false);}} onBlur={()=>setEditFecha(false)} autoFocus style={{fontSize:12,borderRadius:6,border:"none",padding:"2px 8px",textAlign:"center",outline:"none"}}/>:<button onClick={()=>setEditFecha(true)} style={{background:"none",border:"none",cursor:"pointer",color:"#a8c8e8",fontSize:12,padding:0,display:"flex",alignItems:"center",gap:4,margin:"0 auto"}}>{formatFecha(fecha)} ✏️</button>}
          </div>
        </div>
        <div style={{display:"flex",gap:2}}>
          {[{key:"clase",label:"Clase"},{key:"entregas",label:"Entregas"},{key:"examenes",label:"Exámenes"},{key:"resumen",label:"Resumen"},{key:"planillas",label:"Planillas"},{key:"alumno",label:"Alumno"}].map(t=>(<button key={t.key} onClick={()=>setSeccion(t.key)} style={{background:seccion===t.key?C.blanco:"transparent",color:seccion===t.key?C.azul:"#a8c8e8",border:"none",borderRadius:"8px 8px 0 0",padding:"8px 14px",fontSize:12,fontWeight:700,cursor:"pointer"}}>{t.label}</button>))}
        </div>
      </div>

      {/* BARRA TEMAS — solo Clase */}
      {seccion==="clase"&&(
        <div style={{background:C.blanco,borderBottom:`1px solid ${C.grisBorde}`,padding:"10px 16px"}}>

            <Lbl>Descripción de la clase</Lbl>
            <textarea value={descripciones[claveHoy]?.texto||""} onChange={e=>setDescripciones(prev=>({...prev,[claveHoy]:{...prev[claveHoy],texto:e.target.value}}))} placeholder="Escribí qué se hizo en la clase..." style={{width:"100%",border:`1px solid ${C.grisBorde}`,borderRadius:8,padding:"10px",fontSize:12,resize:"vertical",minHeight:56,outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <label style={{flex:1,background:C.fondo,border:`1px dashed ${C.grisBorde}`,borderRadius:8,padding:"8px",textAlign:"center",cursor:"pointer",fontSize:11,color:C.gris,fontWeight:700}}>{descripciones[claveHoy]?.foto?"📄 Foto cargada":"📄 Adjuntar foto"}<input type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f)setDescripciones(prev=>({...prev,[claveHoy]:{...prev[claveHoy],foto:f,fotoPrev:URL.createObjectURL(f)}}));}}/></label>
              <div style={{flex:1}}><AudioRec audioBlob={descripciones[claveHoy]?.audio||null} setAudioBlob={blob=>setDescripciones(prev=>({...prev,[claveHoy]:{...prev[claveHoy],audio:blob}}))}/></div>
            </div>
            {descripciones[claveHoy]?.fotoPrev&&<img src={descripciones[claveHoy].fotoPrev} alt="preview" style={{width:"100%",borderRadius:8,marginTop:8,maxHeight:160,objectFit:"contain",background:"#eee"}}/>}
          </div>)}
        </div>
      )}

      <div style={{padding:"16px"}}>
        {/* CLASE */}
        {seccion==="clase"&&(<div>
          <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
            <button onClick={()=>curso.alumnos.forEach(a=>{setReg(a.id,"presencia","P");if(!getReg(a.id).desempeno)setReg(a.id,"desempeno","=");})} style={{background:C.verdeBg,color:C.verde,border:`1px solid ${C.verde}`,borderRadius:8,padding:"6px 12px",fontSize:11,fontWeight:700,cursor:"pointer"}}>✓ Todos presentes</button>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>

                  {d==="+"&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:C.verdeBg,color:C.verde,fontWeight:800}}>+</span>}
                  {d==="-"&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:C.rojoBg,color:C.rojo,fontWeight:800}}>−</span>}
                  {d==="="&&<span style={{fontSize:11,padding:"2px 7px",borderRadius:4,background:C.azulClaro,color:C.azulMedio,fontWeight:800}}>=</span>}

              <span style={{fontSize:18}}>✓</span> Finalizar clase
            </button>
          </div>
        </div>)}

        {/* ENTREGAS */}
        {seccion==="entregas"&&(<div>
          {/* TEMA */}
          <div style={{background:C.blanco,borderRadius:12,border:`1px solid ${C.grisBorde}`,padding:"14px",marginBottom:12}}>
            <Lbl>Tema</Lbl>
            <SelectorTemas curso={curso} cursoKey={cursoKey} temaIdx={exTemaIdxEnt} setTemaIdx={setExTemaIdxEnt} setCursos={setCursos} editandoTema={editandoTema} setEditandoTema={setEditandoTema} temaInput={temaInput} setTemaInput={setTemaInput} onBorrarTema={(data)=>setConfirmarBorrarTema({...data,setTemaIdx})}/>
          </div>

          {/* SUBTEMAS */}
          <div style={{background:C.blanco,borderRadius:12,border:`1px solid ${C.grisBorde}`,padding:"14px",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <Lbl>Subtemas</Lbl>
              <button onClick={()=>{
                if(!entClaveTema)return;
                setSubtemas(prev=>{
                  const lista=Array.isArray(prev[entClaveTema])?prev[entClaveTema]:prev[entClaveTema]?[prev[entClaveTema]]:[];
                  return{...prev,[entClaveTema]:[...lista,""]};
                });
                setEditandoSubtema("nuevo");
                setSubtemaInput("");
              }} style={{background:"none",border:`1px dashed ${C.azulMedio}`,borderRadius:20,padding:"4px 12px",fontSize:11,color:C.azulMedio,fontWeight:700,cursor:"pointer"}}>
                + Agregar subtema
              </button>
            </div>

            {/* LISTA DE SUBTEMAS */}
            {(()=>{
              const lista=entClaveTema?(Array.isArray(subtemas[entClaveTema])?subtemas[entClaveTema]:subtemas[entClaveTema]?[subtemas[entClaveTema]]:[]):[];
              return(<>
                {lista.length===0&&<div style={{fontSize:12,color:C.gris,fontStyle:"italic"}}>Sin subtemas. Agregá uno para organizar las entregas.</div>}
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {lista.map((sub,idx)=>(
                    <div key={idx}>
                      {editandoSubtema===idx?(
                        <div style={{display:"flex",gap:8,alignItems:"center"}}>
                          <input value={subtemaInput} onChange={e=>setSubtemaInput(e.target.value)}
                            placeholder="Ej: Ejercicios 1-5 pág. 23" autoFocus
                            style={{flex:1,border:`2px solid ${C.azul}`,borderRadius:8,padding:"8px 12px",fontSize:13,outline:"none"}}
                            onKeyDown={e=>{
                              if(e.key==="Enter"){
                                if(!subtemaInput.trim()){
                                  // Eliminar si queda vacío
                                  setSubtemas(prev=>{const l=[...(Array.isArray(prev[entClaveTema])?prev[entClaveTema]:[])];l.splice(idx,1);return{...prev,[entClaveTema]:l};});
                                } else {
                                  setSubtemas(prev=>{const l=[...(Array.isArray(prev[entClaveTema])?prev[entClaveTema]:[])];l[idx]=subtemaInput.trim();return{...prev,[entClaveTema]:l};});
                                }
                                setEditandoSubtema(null);setSubtemaInput("");
                              }
                              if(e.key==="Escape"){setEditandoSubtema(null);setSubtemaInput("");}
                            }}/>
                          <button onClick={()=>{
                            if(!subtemaInput.trim()){
                              setSubtemas(prev=>{const l=[...(Array.isArray(prev[entClaveTema])?prev[entClaveTema]:[])];l.splice(idx,1);return{...prev,[entClaveTema]:l};});
                            } else {
                              setSubtemas(prev=>{const l=[...(Array.isArray(prev[entClaveTema])?prev[entClaveTema]:[])];l[idx]=subtemaInput.trim();return{...prev,[entClaveTema]:l};});
                            }
                            setEditandoSubtema(null);setSubtemaInput("");
                          }} style={{background:C.azul,color:C.blanco,border:"none",borderRadius:8,padding:"8px 14px",fontWeight:800,cursor:"pointer",fontSize:13}}>Guardar</button>
                          <button onClick={()=>{setEditandoSubtema(null);setSubtemaInput("");}} style={{background:C.fondo,color:C.gris,border:"none",borderRadius:8,padding:"8px 10px",cursor:"pointer",fontSize:13}}>✕</button>

                          <button onClick={e=>{e.stopPropagation();setSubtemas(prev=>{const l=[...(Array.isArray(prev[entClaveTema])?prev[entClaveTema]:[])];l.splice(idx,1);return{...prev,[entClaveTema]:l};});}} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:C.rojo,padding:"2px 4px"}}>🗑</button>
                        </div>
                      )}
                    </div>

                {editandoSubtema==="nuevo"&&(

                          setSubtemas(prev=>{const l=Array.isArray(prev[entClaveTema])?[...prev[entClaveTema]]:prev[entClaveTema]?[prev[entClaveTema]]:[];return{...prev,[entClaveTema]:[...l.filter(s=>s!==""),subtemaInput.trim()]};});
                          setEditandoSubtema(null);setSubtemaInput("");
                        }
                        if(e.key==="Escape"){setEditandoSubtema(null);setSubtemaInput("");}
                      }}/>
                    <button onClick={()=>{
                      if(subtemaInput.trim()){
                        setSubtemas(prev=>{const l=Array.isArray(prev[entClaveTema])?[...prev[entClaveTema]]:prev[entClaveTema]?[prev[entClaveTema]]:[];return{...prev,[entClaveTema]:[...l.filter(s=>s!==""),subtemaInput.trim()]};});
                      }
                      setEditandoSubtema(null);setSubtemaInput("");
                    }} style={{background:C.azul,color:C.blanco,border:"none",borderRadius:8,padding:"8px 14px",fontWeight:800,cursor:"pointer",fontSize:13}}>Agregar</button>
                    <button onClick={()=>{setEditandoSubtema(null);setSubtemaInput("");}} style={{background:C.fondo,color:C.gris,border:"none",borderRadius:8,padding:"8px 10px",cursor:"pointer",fontSize:13}}>✕</button>
                  </div>
                )}
              </>);
            })()}
          </div>

          {/* ALUMNOS */}
          {subtemaActual&&(
            <div style={{background:C.azulClaro,borderRadius:8,padding:"8px 14px",marginBottom:12,fontSize:12,fontWeight:700,color:C.azul}}>
              Cargando entregas para: <strong>{subtemaActual}</strong>
            </div>
          )}
          {!subtemaActual&&(
            <div style={{background:C.amarilloBg,border:`1px solid ${C.amarillo}`,borderRadius:8,padding:"8px 14px",marginBottom:12,fontSize:12,color:C.amarillo}}>
              💡 Sin subtema seleccionado — las entregas se registran a nivel del tema general.
            </div>
          )}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {curso.alumnos.map(alumno=>{
              const entAlumno=claveEntrega?entregas[claveEntrega]?.[alumno.id]||{}:{};
              const tarea=entAlumno.tarea;const tp=entAlumno.tp;const tieneAlgo=tarea||(tp!=null&&tp!==undefined);
              return(<div key={alumno.id} style={{background:C.blanco,border:`1px solid ${tieneAlgo?C.azul:C.grisBorde}`,borderRadius:10,padding:"10px 12px"}}>
                <div style={{fontSize:11,fontWeight:700,color:C.texto,marginBottom:8}}>{alumno.nombre}</div>
                {(tarea||(tp!=null))&&(<div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap"}}>{tarea&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:C.azulClaro,color:C.azul,fontWeight:700}}>Tarea: {tarea}</span>}{tp!=null&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:4,background:C.purpuraBg,color:C.purpura,fontWeight:700}}>T.P.: {tp}%</span>}</div>)}
                <div style={{display:"flex",gap:6}}>
                  <button onClick={()=>setCorreccionModal({alumno,tipo:"tarea"})} style={{flex:1,padding:"7px 4px",fontSize:11,fontWeight:700,borderRadius:8,cursor:"pointer",border:`2px solid ${tarea?C.azul:C.grisBorde}`,background:tarea?C.azulClaro:C.blanco,color:tarea?C.azul:C.gris}}>📝 Tarea</button>
                  <button onClick={()=>setCorreccionModal({alumno,tipo:"tp"})} style={{flex:1,padding:"7px 4px",fontSize:11,fontWeight:700,borderRadius:8,cursor:"pointer",border:`2px solid ${tp!=null?C.purpura:C.grisBorde}`,background:tp!=null?C.purpuraBg:C.blanco,color:tp!=null?C.purpura:C.gris}}>📋 T.P.</button>
                </div>
              </div>);
            })}
          </div>
          <button onClick={()=>alert("📋 Las entregas se registrarán en Google Sheets.\n(Función pendiente de conexión con Apps Script)")}
            style={{width:"100%",padding:"16px",background:C.azul,border:"none",borderRadius:12,fontSize:15,fontWeight:800,color:C.blanco,cursor:"pointer",boxShadow:"0 4px 16px rgba(26,58,92,0.3)",display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginTop:12}}>
            <span style={{fontSize:18}}>📋</span> Cargar entregas a la planilla

          <div style={{background:C.blanco,borderRadius:12,border:`1px solid ${C.grisBorde}`,padding:"14px",marginBottom:12}}>

              <div style={{fontSize:12,color:C.gris,marginBottom:16}}>{curso.nombre} — {tema} — {formatFecha(fecha)}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
                {[{label:"Presentes",val:cnt.presentes,color:C.verde,bg:C.verdeBg},{label:"Ausentes",val:cnt.ausentes,color:C.rojo,bg:C.rojoBg},{label:"No trabajaron",val:resFin().noTrabajaron.length,color:C.amarillo,bg:C.amarilloBg}].map((s,i)=>(<div key={i} style={{background:s.bg,borderRadius:10,padding:"10px 6px",textAlign:"center"}}><div style={{fontSize:24,fontWeight:800,color:s.color}}>{s.val}</div><div style={{fontSize:10,color:C.gris,marginTop:2}}>{s.label}</div></div>))}
              </div>

              {/* DESCRIPCIÓN (fuente principal) */}
              <Lbl>Descripción de la clase</Lbl>
              {descripciones[claveHoy]?.texto?(
                <div style={{background:C.verdeBg,border:`1px solid ${C.verde}`,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.verde,fontWeight:600}}>
                  ✓ Ya tenés la descripción cargada en la solapa Clase
                </div>
              ):(
                <div style={{background:C.amarilloBg,border:`1px solid ${C.amarillo}`,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.amarillo}}>
                  ⚠️ No hay descripción cargada. Volvé a la solapa Clase y escribila, o adjuntá una foto/audio abajo.
                </div>
              )}

              {/* FOTO Y AUDIO OPCIONALES */}
              <Lbl>Adjuntos opcionales (foto del pizarrón / audio)</Lbl>
              <div style={{marginBottom:10}}>
                <label style={{display:"block",background:C.fondo,border:`2px dashed ${fotoFin?C.verde:C.grisBorde}`,borderRadius:8,padding:"10px",textAlign:"center",cursor:"pointer",color:fotoFin?C.verde:C.gris,fontSize:12,marginBottom:8}}>
                  {fotoFin?`📸 ${fotoFin.name}`:"📸 Foto del pizarrón (opcional)"}
                  <input type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(f){setFotoFin(f);setFotoFinPrev(URL.createObjectURL(f));}}}/>
                </label>
                {fotoFinPrev&&<img src={fotoFinPrev} alt="preview" style={{width:"100%",borderRadius:8,maxHeight:160,objectFit:"contain",background:"#eee"}}/>}
              </div>
              <AudioRec audioBlob={audioFin} setAudioBlob={setAudioFin}/>

              {errGen&&<div style={{background:C.rojoBg,border:`1px solid ${C.rojo}`,borderRadius:8,padding:"10px 14px",color:C.rojo,fontSize:12,margin:"12px 0"}}>{errGen}</div>}
              <div style={{display:"flex",gap:10,marginTop:16}}>
                <button onClick={resetFin} style={{flex:1,padding:"14px",background:C.fondo,border:"none",borderRadius:10,fontSize:14,fontWeight:700,color:C.gris,cursor:"pointer"}}>Cancelar</button>
                <button onClick={generarMinuta}
                  style={{flex:2,padding:"14px",background:C.azul,border:"none",borderRadius:10,fontSize:14,fontWeight:800,color:C.blanco,cursor:"pointer"}}>
                  Ver borrador →
                </button>
              </div>
            </>)}
            {pasoFin==="generando"&&<div style={{textAlign:"center",padding:"40px 0"}}><div style={{fontSize:40,marginBottom:16}}>⚙️</div><div style={{fontSize:16,fontWeight:700,color:C.azul}}>Generando minuta...</div></div>}
            {pasoFin==="preview"&&minutaGen&&(<>
              <div style={{fontSize:16,fontWeight:800,color:C.azul,marginBottom:2}}>Borrador para Classroom</div>
              <div style={{fontSize:11,color:C.gris,marginBottom:14}}>{curso.nombre} — {formatFecha(fecha)}</div>

              {/* PREVIEW EXACTO DEL POST DE CLASSROOM */}
              <div style={{background:"#fff",borderRadius:12,border:"2px solid #4285f4",marginBottom:14,overflow:"hidden"}}>
                {/* Header estilo Classroom */}
                <div style={{background:"#4285f4",padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
                  <div style={{width:28,height:28,borderRadius:"50%",background:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#4285f4"}}>S</div>
                  <div>
                    <div style={{fontSize:11,fontWeight:700,color:"white"}}>Prof. Seré · {curso.nombre}</div>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.8)"}}>{formatFecha(fecha)}</div>
                  </div>
                </div>
                {/* Contenido editable */}
                <div style={{padding:"14px"}}>
                  {minutaGen.tipoClase?.length>0&&(
                    <div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
                      {minutaGen.tipoClase.map((t,i)=><span key={i} style={{background:"#e8f0fe",color:"#4285f4",borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700}}>{t}</span>)}
                    </div>
                  )}
                  <textarea
                    value={`📚 ${minutaGen.titulo||minutaGen.tema}\n\n${minutaGen.desarrollo}${minutaGen.noTrabajaron?.length>0?"\n\n⚠️ No trabajaron: "+minutaGen.noTrabajaron.join(", "):""}${minutaGen.destacaron?.length>0?"\n\n⭐ Se destacaron: "+minutaGen.destacaron.join(", "):""}`}
                    onChange={e=>{
                      const lines=e.target.value.split("\n");
                      setMinutaGen({...minutaGen,titulo:lines[0].replace("📚 ",""),desarrollo:lines.slice(2).join("\n")});
                    }}
                    style={{width:"100%",minHeight:160,border:"none",outline:"none",resize:"vertical",fontSize:13,lineHeight:1.7,fontFamily:"system-ui",color:"#333",boxSizing:"border-box"}}/>
                </div>
              </div>

              <div style={{display:"flex",gap:10}}>
                <button onClick={()=>setPasoFin("input")} style={{flex:1,padding:"13px",background:C.fondo,border:"none",borderRadius:10,fontSize:13,fontWeight:700,color:C.gris,cursor:"pointer"}}>← Editar</button>
                <button onClick={ejecutarTodo} style={{flex:2,padding:"13px",background:"#4285f4",border:"none",borderRadius:10,fontSize:14,fontWeight:800,color:C.blanco,cursor:"pointer"}}>📤 Publicar en Classroom</button>
              </div>
            </>)}
            {pasoFin==="ejecutando"&&<div style={{textAlign:"center",padding:"40px 0"}}><div style={{fontSize:40,marginBottom:16}}>📤</div><div style={{fontSize:16,fontWeight:700,color:C.azul}}>Publicando en Classroom...</div></div>}
            {pasoFin==="listo"&&minutaGen&&(()=>{
              const courseId=classroomIds[cursoKey];
              const titulo=minutaGen.titulo||minutaGen.tema||tema;
              const cuerpo=[
                `📚 ${titulo}`,
                ``,
                minutaGen.desarrollo||"",
                minutaGen.noTrabajaron?.length>0?`⚠️ No trabajaron: ${minutaGen.noTrabajaron.join(", ")}`:"",
                minutaGen.destacaron?.length>0?`⭐ Se destacaron: ${minutaGen.destacaron.join(", ")}`:"",
              ].filter(Boolean).join("\n");
              return(
                <div style={{textAlign:"center",padding:"16px 0"}}>
                  <div style={{fontSize:48,marginBottom:8}}>✅</div>
                  <div style={{fontSize:18,fontWeight:800,color:C.azul,marginBottom:4}}>Clase finalizada</div>
                  <div style={{fontSize:12,color:C.gris,marginBottom:20}}>{curso.nombre} — {tema} — {formatFecha(fecha)}</div>

                  {courseId&&appsScriptUrl?(
                    <div style={{marginBottom:16}}>
                      <button onClick={async()=>{
                        const btn=document.getElementById("btn-publicar-classroom");
                        if(btn){btn.textContent="⏳ Guardando en Drive...";btn.disabled=true;}
                        await publicarEnClassroom(courseId,cuerpo);
                        if(btn){btn.textContent="✓ Abierto en nueva pestaña";btn.style.background=C.verde;}
                      }} id="btn-publicar-classroom"
                        style={{width:"100%",padding:"14px",background:"#4285f4",color:"white",border:"none",borderRadius:10,fontSize:14,fontWeight:800,cursor:"pointer",marginBottom:8}}>
                        🎓 Publicar en Google Classroom
                      </button>
                      <div style={{fontSize:10,color:C.gris}}>Guarda la minuta en Drive → la abre en Classroom → se publica sola</div>
                    </div>
                  ):(
                    <div style={{background:C.amarilloBg,border:`1px solid ${C.amarillo}`,borderRadius:8,padding:"10px 14px",fontSize:12,color:C.amarillo,marginBottom:16,textAlign:"left"}}>
                      ⚠️ Sin Classroom vinculado. Configurá desde ⚙️ Classroom en la pantalla inicial.
                    </div>
                  )}

                  <button onClick={()=>{
                    navigator.clipboard?.writeText(cuerpo).then(()=>alert("✓ Copiado al portapapeles"));
                  }} style={{width:"100%",padding:"10px",background:C.fondo,border:`1px solid ${C.grisBorde}`,borderRadius:8,fontSize:12,color:C.gris,cursor:"pointer",marginBottom:12}}>
                    📋 Copiar texto de la minuta
                  </button>

                  <div style={{background:C.fondo,borderRadius:10,padding:"12px 14px",textAlign:"left",marginBottom:16,fontSize:11,color:C.texto,lineHeight:1.7,whiteSpace:"pre-wrap"}}>
                    {cuerpo}
                  </div>

                  <button onClick={resetFin} style={{width:"100%",padding:"14px",background:C.azul,border:"none",borderRadius:10,fontSize:14,fontWeight:800,color:C.blanco,cursor:"pointer"}}>
                    Cerrar
                  </button>
                </div>
              );
            })()}
          </div>
        </div>
      )}
    </div>
  );
}


    ReactDOM.render(<AulaApp/>, document.getElementById('root'));
  </script>
</body>
</html>
