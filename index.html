        async get(key){ return this._data[key]!==undefined?{key,value:this._data[key]}:null; },
        async set(key,value){ this._data[key]=value; this._save(); return {key,value}; },

function buildObsPrompt(cn,an){return `Sos el asistente del Prof. Seré, docente de Matemática del Colegio Los Molinos. Alumno: ${an} | Curso: ${cn}. TIPO: "Disciplinaria","Pedagógica","Positiva". MOTIVO exacto. DISCIPLINARIA: Faltó el respeto a una autoridad|Desobedeció una indicación|Trató inadecuadamente a compañeros / un compañero|Utilizó lenguaje grosero|Molestó en clase / ámbito de estudio / charla|Mal comportamiento en el comedor|Se ausentó a clase sin autorización|Llegó tarde a clase|Se copió / intentó copiarse / colaboró en la copia|Utilizó de manera inapropiada el material del colegio|Su presentación personal es inadecuada|Uso indebido del ascensor|Uso indebido del celular. PEDAGÓGICA: No hizo la tarea|Tarea incompleta / poco elaborada|No trae el material requerido para trabajar|Estuvo disperso o distraído|Participó negativamente|No aprovechó el tiempo de trabajo|Rendimiento muy bajo en una instancia de evaluación|Se observa una desconexión general con la materia. SANCION: true solo grave. TEXTO: formal tercera persona "el alumno" solo hechos. JSON sin markdown: {"tipo":"Disciplinaria","motivo":"exacto","sancion":false,"texto":"formal"}`;}
function buildPrefillUrl(data,ck,an){const now=new Date();const fk=KEY_MAP[ck]||ck;const p=new URLSearchParams();p.set("usp","pp_url");p.set("entry.715492923","Seré");p.set("entry.313039572","Matemática");p.set("entry.1340401298_day",now.getDate());p.set("entry.1340401298_month",now.getMonth()+1);p.set("entry.1340401298_year",now.getFullYear());p.set("entry.287912277",fk);const ae=ALUMNO_ENTRY[fk];if(ae)p.set(`entry.${ae}`,an);p.set("entry.1476522973",data.tipo);if(data.tipo==="Disciplinaria"){p.set("entry.620622760",data.motivo);if(data.sancion)p.set("entry.555195174","SI");}else if(data.tipo==="Pedagógica")p.set("entry.1758937",data.motivo);p.set("entry.353356145",data.texto);return `${FORM_BASE}?${p.toString()}`;}

function isoHoy(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function formatFecha(iso){if(!iso)return"";const[y,m,d]=iso.split("-");return`${d}/${m}/${y}`;}
function fechaLarga(iso){const d=iso?new Date(iso+"T12:00:00"):new Date();const dias=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];const meses=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];return`${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;}
function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
function formatTiempo(s){return`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;}

function AudioRec({audioBlob,setAudioBlob}){
  const [grab,setGrab]=useState(false);const [t,setT]=useState(0);
  const mr=useRef(null);const ch=useRef([]);const ti=useRef(null);
  async function ini(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(s);ch.current=[];rec.ondataavailable=e=>ch.current.push(e.data);rec.onstop=()=>{setAudioBlob(new Blob(ch.current,{type:"audio/webm"}));s.getTracks().forEach(t=>t.stop());};rec.start();mr.current=rec;setGrab(true);setT(0);ti.current=setInterval(()=>setT(x=>x+1),1000);}catch{alert("No se pudo acceder al micrófono.");}}
  function det(){mr.current?.stop();clearInterval(ti.current);setGrab(false);}
  return(<div style={{background:C.fondo,borderRadius:10,padding:"12px"}}>
    {!grab&&!audioBlob&&<button onClick={ini} style={{width:"100%",padding:"10px",background:C.azul,color:C.blanco,border:"none",borderRadius:8,fontSize:13,fontWeight:800,cursor:"pointer"}}>🎙️ Grabar audio</button>}
    {grab&&<div style={{textAlign:"center"}}><div style={{fontSize:24,fontWeight:800,color:C.rojo,letterSpacing:4,marginBottom:4}}>{formatTiempo(t)}</div><button onClick={det} style={{padding:"8px 24px",background:C.rojo,color:C.blanco,border:"none",borderRadius:8,fontSize:12,fontWeight:800,cursor:"pointer"}}>■ Detener</button></div>}
    {audioBlob&&!grab&&<div><div style={{fontSize:11,color:C.verde,fontWeight:700,marginBottom:6}}>✓ Audio ({formatTiempo(t)})</div><audio controls src={URL.createObjectURL(audioBlob)} style={{width:"100%",marginBottom:6}}/><button onClick={()=>{setAudioBlob(null);setT(0);}} style={{fontSize:11,color:C.gris,background:"none",border:"none",cursor:"pointer",textDecoration:"underline"}}>Volver a grabar</button></div>}
  </div>);
}

function ModalObservacion({alumno,cursoKey,cursoNombre,fecha,onClose,onGuardar}){
  const [paso,setPaso]=useState("input");const [texto,setTexto]=useState("");const [result,setResult]=useState(null);const [err,setErr]=useState("");const recRef=useRef(null);const [dict,setDict]=useState(false);
  function toggleVoz(){if(dict){recRef.current?.stop();setDict(false);return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setErr("Requiere Chrome.");return;}const r=new SR();r.lang="es-AR";r.continuous=false;r.interimResults=false;r.onresult=e=>{const t=e.results[0][0].transcript;setTexto(p=>p?p+" "+t:t);};r.onend=()=>setDict(false);r.onerror=()=>{setDict(false);setErr("Error en micrófono.");};r.start();recRef.current=r;setDict(true);setErr("");}
  async function procesar(){if(!texto.trim()){setErr("Describí la situación.");return;}setErr("");setPaso("procesando");try{const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:buildObsPrompt(cursoNombre,alumno.nombre),messages:[{role:"user",content:texto}]})});const data=await resp.json();const raw=data.content?.find(b=>b.type==="text")?.text||"";const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
      setResult(parsed);
      setPaso("preview");
      if(onGuardar){onGuardar({tipo:parsed.tipo,motivo:parsed.motivo,texto:parsed.texto,fecha:new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})});}
    }catch(e){setErr("Error: "+e.message);setPaso("input");}}
  const tipoS=result?TIPO_STYLE[result.tipo]||TIPO_STYLE["Disciplinaria"]:{};
  const formUrl=result?buildPrefillUrl(result,cursoKey,alumno.nombre):null;
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"flex-end",zIndex:300}} onClick={()=>paso!=="procesando"&&onClose()}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.blanco,borderRadius:"20px 20px 0 0",padding:"24px 20px 40px",width:"100%",maxWidth:520,margin:"0 auto",maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{fontSize:17,fontWeight:800,color:C.azul,marginBottom:2}}>Observación</div>
      <div style={{fontSize:12,color:C.gris,marginBottom:20}}>{alumno.nombre} · {cursoNombre} · {formatFecha(fecha)}</div>
      {paso==="input"&&(<><Lbl>Describí la situación</Lbl><textarea value={texto} onChange={e=>setTexto(e.target.value)} placeholder='Ej: "Molestó a un compañero y no atendió las indicaciones"' style={{width:"100%",minHeight:90,padding:"10px 12px",fontSize:13,borderRadius:8,border:`1px solid ${C.grisBorde}`,resize:"vertical",boxSizing:"border-box",lineHeight:1.7,fontFamily:"inherit",outline:"none",marginBottom:10}}/><div style={{display:"flex",gap:8,marginBottom:12}}><button onClick={toggleVoz} style={{display:"flex",alignItems:"center",gap:6,padding:"9px 14px",fontSize:13,borderRadius:8,cursor:"pointer",border:`2px solid ${dict?C.rojo:C.grisBorde}`,background:dict?C.rojoBg:C.blanco,color:dict?C.rojo:C.gris,fontWeight:700}}>{dict?"⏹ Detener":"🎙️ Dictar"}</button><button onClick={procesar} disabled={!texto.trim()} style={{flex:1,padding:"9px 14px",fontSize:13,fontWeight:800,borderRadius:8,border:"none",background:!texto.trim()?C.gris:C.amarillo,color:C.blanco,cursor:!texto.trim()?"not-allowed":"pointer"}}>Generar observación →</button></div>{err&&<div style={{background:C.rojoBg,border:`1px solid ${C.rojo}`,borderRadius:8,padding:"8px 12px",color:C.rojo,fontSize:12,marginBottom:10}}>{err}</div>}<button onClick={onClose} style={{width:"100%",padding:"11px",background:C.fondo,border:"none",borderRadius:8,fontSize:13,fontWeight:700,color:C.gris,cursor:"pointer"}}>Cancelar</button></>)}
      {paso==="procesando"&&<div style={{textAlign:"center",padding:"32px 0"}}><div style={{fontSize:36,marginBottom:12}}>⚙️</div><div style={{fontSize:15,fontWeight:700,color:C.azul}}>Generando observación...</div></div>}
      {paso==="preview"&&result&&(<><div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><div style={{background:C.fondo,borderRadius:10,padding:"10px 12px"}}><Lbl>Alumno</Lbl><div style={{fontSize:13,fontWeight:700,color:C.texto}}>{alumno.nombre}</div></div><div style={{background:C.fondo,borderRadius:10,padding:"10px 12px"}}><Lbl>Tipo</Lbl><span style={{display:"inline-block",fontSize:13,fontWeight:700,padding:"3px 10px",borderRadius:6,background:tipoS.bg,color:tipoS.color}}>{result.tipo}</span></div></div><div style={{background:C.fondo,borderRadius:10,padding:"10px 12px"}}><Lbl>Motivo</Lbl><div style={{fontSize:13,color:C.texto}}>{result.motivo}</div></div>{result.tipo==="Disciplinaria"&&<div style={{background:C.fondo,borderRadius:10,padding:"10px 12px"}}><Lbl>Sanción</Lbl><span style={{display:"inline-block",fontSize:13,fontWeight:700,padding:"3px 10px",borderRadius:6,background:result.sancion?"#FCEBEB":"#EAF3DE",color:result.sancion?"#A32D2D":"#3B6D11"}}>{result.sancion?"Sí":"No"}</span></div>}<div style={{background:C.fondo,borderRadius:10,padding:"10px 12px"}}><Lbl>Texto</Lbl><div style={{fontSize:13,color:C.texto,lineHeight:1.75}}>{result.texto}</div></div></div><a href={formUrl} target="_blank" rel="noreferrer" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,padding:"13px",fontSize:14,fontWeight:800,borderRadius:10,border:"none",background:C.azul,color:C.blanco,textDecoration:"none",marginBottom:8}}>🔗 Abrir formulario pre-completado</a><div style={{fontSize:11,color:C.gris,textAlign:"center",marginBottom:12}}>El formulario se abre con todos los campos cargados.</div><div style={{display:"flex",gap:8}}><button onClick={()=>{setPaso("input");setResult(null);setTexto("");setErr("");}} style={{flex:1,padding:"11px",background:C.fondo,border:"none",borderRadius:8,fontSize:13,fontWeight:700,color:C.gris,cursor:"pointer"}}>← Nueva</button><button onClick={onClose} style={{flex:1,padding:"11px",background:C.fondo,border:"none",borderRadius:8,fontSize:13,fontWeight:700,color:C.gris,cursor:"pointer"}}>Cerrar</button></div></>)}
    </div>
  </div>);
}

function ModalCorreccion({alumno,tipo,claveEntrega,entregas,setEntregas,onClose}){
  const entAlumno=entregas[claveEntrega]?.[alumno.id]||{};
  const valorActual=tipo==="tarea"?(entAlumno.tarea||null):(entAlumno.tp!=null?entAlumno.tp:null);
  function setValor(v){setEntregas(prev=>({...prev,[claveEntrega]:{...prev[claveEntrega],[alumno.id]:{...(prev[claveEntrega]?.[alumno.id]||{}),[tipo]:v===valorActual?null:v}}}));}
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"flex-end",zIndex:300}} onClick={onClose}>
    <div onClick={e=>e.stopPropagation()} style={{background:C.blanco,borderRadius:"20px 20px 0 0",padding:"24px 20px 36px",width:"100%",maxWidth:480,margin:"0 auto"}}>
      <div style={{fontSize:16,fontWeight:800,color:C.azul,marginBottom:2}}>{tipo==="tarea"?"Corrección de Tarea":"Corrección de T.P."}</div>
      <div style={{fontSize:12,color:C.gris,marginBottom:20}}>{alumno.nombre}</div>
      {tipo==="tarea"&&(<><Lbl>Calificación</Lbl><div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>{["M","R","B-","B"].map(n=>(<button key={n} onClick={()=>setValor(n)} style={{padding:"20px 0",borderRadius:10,fontWeight:900,fontSize:20,cursor:"pointer",border:`2px solid ${valorActual===n?C.azul:C.grisBorde}`,background:valorActual===n?C.azul:C.blanco,color:valorActual===n?C.blanco:C.gris}}>{n}</button>))}</div>{valorActual&&<div style={{background:C.azulClaro,borderRadius:10,padding:"12px 16px",marginBottom:16,textAlign:"center",fontSize:15,fontWeight:700,color:C.azul}}>✓ Calificado: <strong>{valorActual}</strong></div>}</>)}
      {tipo==="tp"&&(<><Lbl>Porcentaje (0% – 100%)</Lbl><div style={{marginBottom:16}}><input type="range" min="0" max="100" step="5" value={valorActual||0} onChange={e=>setValor(Number(e.target.value))} style={{width:"100%",accentColor:C.azul,marginBottom:8}}/><div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.gris,marginBottom:12}}><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div><div style={{textAlign:"center",marginBottom:12}}><span style={{fontSize:36,fontWeight:900,color:valorActual>=60?C.verde:valorActual>0?C.amarillo:C.gris}}>{valorActual||0}%</span></div><div style={{display:"flex",alignItems:"center",gap:10,background:C.fondo,borderRadius:10,padding:"10px 14px"}}><span style={{fontSize:12,color:C.gris,fontWeight:600,whiteSpace:"nowrap"}}>Manual:</span><input type="number" min="0" max="100" step="1" value={valorActual||""} onChange={e=>{const v=Math.min(100,Math.max(0,Number(e.target.value)));setValor(isNaN(v)?0:v);}} placeholder="0" style={{width:70,border:`2px solid ${C.azul}`,borderRadius:8,padding:"8px",fontSize:18,fontWeight:800,textAlign:"center",outline:"none",color:C.azul}}/><span style={{fontSize:16,fontWeight:700,color:C.azul}}>%</span></div></div><div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6,marginBottom:16}}>{[0,25,50,75,100].map(v=>(<button key={v} onClick={()=>setValor(v)} style={{padding:"8px 0",borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer",border:`2px solid ${valorActual===v?C.azul:C.grisBorde}`,background:valorActual===v?C.azul:C.blanco,color:valorActual===v?C.blanco:C.gris}}>{v}%</button>))}</div></>)}
      <div style={{display:"flex",gap:10}}>{valorActual!=null&&valorActual!==""&&<button onClick={()=>setValor(null)} style={{flex:1,padding:"12px",background:C.rojoBg,border:`1px solid ${C.rojo}`,borderRadius:10,fontSize:13,fontWeight:700,color:C.rojo,cursor:"pointer"}}>Limpiar</button>}<button onClick={onClose} style={{flex:2,padding:"12px",background:C.azul,border:"none",borderRadius:10,fontSize:13,fontWeight:800,color:C.blanco,cursor:"pointer"}}>Guardar y cerrar</button></div>
    </div>
  </div>);
}

function SelectorTemas({curso,cursoKey,temaIdx,setTemaIdx,setCursos,editandoTema,setEditandoTema,temaInput,setTemaInput,onBorrarTema}){
  function guardar(){if(!temaInput.trim())return;const esNuevo=editandoTema==="nuevo";const nuevoIdx=curso.temas.length;setCursos(prev=>{const t=[...(prev[cursoKey].temas||[])];if(esNuevo)t.push(temaInput.trim());else t[editandoTema]=temaInput.trim();return{...prev,[cursoKey]:{...prev[cursoKey],temas:t}};});if(esNuevo)setTemaIdx(nuevoIdx);setEditandoTema(null);setTemaInput("");}
  return(<>
    <div style={{display:"flex",gap:8,overflowX:"auto",alignItems:"center",flexWrap:"wrap"}}>
      {curso.temas.map((t,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:4}}><button onClick={()=>{setTemaIdx(i);setEditandoTema(null);}} style={{background:temaIdx===i?C.azul:C.azulClaro,color:temaIdx===i?C.blanco:C.azul,border:"none",borderRadius:20,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{t}</button>{temaIdx===i&&<>
            <button onClick={()=>{setEditandoTema(i);setTemaInput(t);}} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:C.gris,padding:"0 2px"}}>✏️</button>
            <button onClick={()=>onBorrarTema&&onBorrarTema({idx:i,nombre:t})} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:C.rojo,padding:"0 2px"}}>🗑</button>
          </>}</div>))}
      <button onClick={()=>{setEditandoTema("nuevo");setTemaInput("");}} style={{background:"none",border:`1px dashed ${C.azulMedio}`,borderRadius:20,padding:"5px 12px",fontSize:12,color:C.azulMedio,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>+ Tema</button>
    </div>
    {editandoTema!==null&&(<div style={{marginTop:10,display:"flex",gap:8,alignItems:"center"}}><input value={temaInput} onChange={e=>setTemaInput(e.target.value)} placeholder={editandoTema==="nuevo"?"Nombre del nuevo tema...":"Editar tema..."} autoFocus style={{flex:1,border:`2px solid ${C.azul}`,borderRadius:8,padding:"8px 12px",fontSize:13,outline:"none"}} onKeyDown={e=>{if(e.key==="Enter")guardar();if(e.key==="Escape"){setEditandoTema(null);setTemaInput("");}}}/><button onClick={guardar} style={{background:C.azul,color:C.blanco,border:"none",borderRadius:8,padding:"8px 16px",fontWeight:800,cursor:"pointer",fontSize:13}}>{editandoTema==="nuevo"?"Agregar":"Guardar"}</button><button onClick={()=>{setEditandoTema(null);setTemaInput("");}} style={{background:C.fondo,color:C.gris,border:"none",borderRadius:8,padding:"8px 12px",cursor:"pointer",fontSize:13}}>✕</button></div>)}
  </>);
}


// ── FICHA ALUMNO ─────────────────────────────────────────────────────────────
function FichaAlumno({curso, cursoKey, alumno, registros, entregas, exNotas, exTipos, exFechas={}, observaciones=[], radarHistorialExterno={}, onCargarStorage, tutorInfo=null}){
  const temas = curso.temas;
  const hoy = new Date().toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});
  const [emailTutor, setEmailTutor] = useState(tutorInfo?.email||"");
  const [generandoMail, setGenerandoMail] = useState(false);
  const [mailPreview, setMailPreview] = useState(null);
  const [errMail, setErrMail] = useState("");
  // Radar de habilidades
  const [radarHist, setRadarHist] = useState(null); // historial de Drive
  // Auto-cargar si llegan datos externos
  React.useEffect(()=>{
    if(radarHistorialExterno&&Object.keys(radarHistorialExterno).length>0){
      setRadarHist(radarHistorialExterno);
    }
  },[radarHistorialExterno]);
  const [radarCargando, setRadarCargando] = useState(false);
  const [radarPDF, setRadarPDF] = useState(null);
  const [radarAnalizando, setRadarAnalizando] = useState(false);
  const [radarErr, setRadarErr] = useState("");
  const DRIVE_FILE_ID = "16UPEiyo97my9QSGIB6xdBxMcUttiwT4k";
  const MCP_URL = "https://drivemcp.googleapis.com/mcp/v1";
  const radarKey = `${cursoKey}__${temas[0]||"general"}`; // clave por curso

  // ── HELPERS ──
  function getClasesDelTema(temaItem){
    return Object.keys(registros).filter(k=>k.startsWith(`${cursoKey}__${temaItem}__`)).sort();
  }
  function getRegAlumno(clave){
    return registros[clave]?.[alumno.id]||{};
  }
  function getTiposEval(temaItem){
    const clave=`${cursoKey}__${temaItem}`;
    const g=exTipos&&exTipos[clave];
    return(Array.isArray(g)&&g.length>0)?[...g]:["Parcial"];
  }
  function getEx(temaItem,tipo){
    if(!exNotas||!temaItem||!tipo)return{};
    return exNotas[`${cursoKey}__${temaItem}__${tipo}`]?.[alumno.id]||{};
  }
  function getEntregasTema(temaItem){
    const res=[];
    Object.entries(entregas).forEach(([clave,reg])=>{
      if(!clave.startsWith(`${cursoKey}__${temaItem}`))return;
      const e=reg[alumno.id];if(!e)return;
      const sub=clave.replace(`${cursoKey}__${temaItem}__`,"").replace(`${cursoKey}__${temaItem}`,"");
      res.push({sub:sub||null,tarea:e.tarea||null,tp:e.tp!=null?e.tp:null});
    });
    return res;
  }

  // ── ASISTENCIA GLOBAL ──
  let totClases=0,totPresente=0,totJust=0;
  temas.forEach(t=>getClasesDelTema(t).forEach(clave=>{
    const r=getRegAlumno(clave);
    if(r.presencia){totClases++;if(r.presencia==="P")totPresente++;if(r.presencia==="J")totJust++;}
  }));
  const pctGlobal=totClases>0?Math.round((totPresente/totClases)*100):null;

  const colNota=(n)=>n>=7?C.verde:n>=5?C.amarillo:C.rojo;
  const bgNota=(n)=>n>=7?C.verdeBg:n>=5?C.amarilloBg:C.rojoBg;

  const tdS={padding:"5px 8px",borderRight:"1px solid #e0e0e0",borderBottom:"1px solid #e0e0e0",fontSize:11,textAlign:"center",verticalAlign:"middle"};
  const thS={...tdS,background:"#1a3a5c",color:"#fff",fontWeight:700,fontSize:10};

  // ── RADAR: leer Drive ─────────────────────────────────────────────────────
  async function cargarRadarDrive(){
    setRadarCargando(true);setRadarErr("");
    try{
      // Primero usar historial en memoria (del estado de AulaApp — disponible inmediatamente)
      let hist=radarHistorialExterno&&Object.keys(radarHistorialExterno).length>0
        ?radarHistorialExterno
        :{};
      // Si está vacío, intentar desde storage
      if(Object.keys(hist).length===0){
        try{
          const stored=await window.storage.get("radar_historial");
          if(stored&&stored.value)hist=JSON.parse(stored.value);
        }catch(e){}
        // Si storage tampoco tiene, intentar cargar vía callback
        if(Object.keys(hist).length===0&&onCargarStorage){
          hist=await onCargarStorage()||{};
        }
      }
      setRadarHist(hist);
      if(Object.keys(hist).length===0){
        setRadarErr("No hay datos guardados todavía. Analizá un examen desde la solapa Exámenes primero.");
      }
    }catch(e){setRadarErr("Error: "+e.message);}
    setRadarCargando(false);
  }

  async function analizarExamenRadar(){
    if(!radarPDF)return;
    const curso2=curso;
    const skills=curso2.skills||[
      {id:"calc",nom:"Cálculo y operatoria",ico:"🔢"},
      {id:"ecua",nom:"Resolución de ecuaciones",ico:"⚖️"},
      {id:"conc",nom:"Comprensión conceptual",ico:"📐"},
      {id:"mode",nom:"Interpretación y modelado",ico:"📊"},
      {id:"proc",nom:"Procedimiento y organización",ico:"🧩"},
      {id:"razo",nom:"Razonamiento lógico",ico:"🎲"}
    ];
    setRadarAnalizando(true);setRadarErr("");
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(radarPDF);});
      const skillsList=skills.map(s=>`- ${s.nom} (id: ${s.id}): 0-100`).join("\n");
      const tipo=document.getElementById("radar-tipo-sel")?.value||"Parcial";
      const tema=document.getElementById("radar-tema-sel")?.value||temas[0];
      const prompt=`Sos corrector de exámenes de matemáticas del Colegio Los Molinos.
Analizá el examen de "${tema}" (${tipo}) para ${curso2.nombre}.
El PDF contiene respuestas de TODOS los alumnos. Identificá cada alumno por nombre.
Evaluá estas habilidades (0-100) por alumno:\n${skillsList}
Criterios: 80+ excelente, 60-79 bueno, 40-59 parcial, 20-39 bajo, 0-19 sin demostrar.
JSON sin markdown: {"tema":"${tema}","tipo":"${tipo}","curso":"${curso2.nombre}","fecha":"${new Date().toISOString().split("T")[0]}","alumnos":[{"nombre":"APELLIDO, Nombre","nota":7.5,"skills":{"${skills.map(s=>s.id).join('":70,"')}":70},"fortalezas":["skill"],"debilidades":["skill"],"observacion":"texto"}]}`;
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:4000,messages:[{role:"user",content:[
          {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},
          {type:"text",text:prompt}
        ]}]})
      });
      const data=await resp.json();
      const txt=data.content?.find(b=>b.type==="text")?.text||"";
      if(!txt) throw new Error("Claude no devolvió respuesta. Intentá con un PDF más pequeño.");
      const txtClean=txt.replace(/```json|```/g,"").trim();
      // Si el JSON está incompleto, intentar repararlo
      let resultado;
      try{
        resultado=JSON.parse(txtClean);
      }catch(parseErr){
        // Intentar cerrar el JSON si está truncado
        const truncado=txtClean.replace(/,\s*$/, "");
        const intentos=[
          truncado+"}]}",
          truncado+"]}",
          truncado+"}",
        ];
        let parseado=null;
        for(const intento of intentos){
          try{parseado=JSON.parse(intento);break;}catch(e){}
        }
        if(!parseado) throw new Error(`JSON incompleto — el PDF puede ser muy largo. Probá analizar el curso en dos mitades. Detalle: ${parseErr.message}`);
        resultado=parseado;
      }
      if(!resultado.alumnos||resultado.alumnos.length===0) throw new Error("Claude no detectó alumnos en el PDF. Verificá que el PDF sea legible y contenga exámenes escritos a mano.");
      resultado._cursoKey=cursoKey;
      // Guardar en Drive
      const hist=radarHist||{};
      const key=`${cursoKey}__${tema}`;
      if(!hist[key])hist[key]={curso:curso2.nombre,tema,cursoKey,instancias:[]};
      // No se sobreescribe — se acumulan todas las instancias
      hist[key].instancias.push({tipo,fecha:resultado.fecha,alumnos:resultado.alumnos});
      const order=["Parcial","Recuperatorio","Recuperatorio 2"];
      hist[key].instancias.sort((a,b)=>order.indexOf(a.tipo)-order.indexOf(b.tipo));
      await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",max_tokens:500,
          system:"Actualizá el archivo de Drive con id '"+DRIVE_FILE_ID+"' con este JSON. Respondé solo OK.",
          messages:[{role:"user",content:"Actualizá radar_habilidades_molinos.json con: "+JSON.stringify(hist)}],
          mcp_servers:[{type:"url",url:MCP_URL,name:"gdrive"}]
        })
      });
      setRadarHist({...hist});
      setRadarErr("");
    }catch(e){setRadarErr("Error al analizar: "+e.message);}
    setRadarAnalizando(false);
  }

  async function generarMail(){
    if(!emailTutor.trim()){setErrMail("Ingresá el email del tutor.");return;}
    setErrMail("");setGenerandoMail(true);setMailPreview(null);

    // Construir resumen textual del alumno para enviar a Claude
    let resumen=`Alumno: ${alumno.nombre}\nCurso: ${curso.nombre}\nFecha: ${hoy}\n\n`;

    // Asistencia global
    let totC=0,totP=0;
    temas.forEach(t=>getClasesDelTema(t).forEach(clave=>{
      const r=getRegAlumno(clave);
      if(r.presencia){totC++;if(r.presencia==="P"||r.presencia==="J")totP++;}
    }));
    const pct=totC>0?Math.round((totP/totC)*100):null;
    resumen+=`ASISTENCIA GLOBAL: ${pct!==null?pct+"% ("+totP+"/"+totC+" clases)":"Sin datos"}\n\n`;

    // Por tema
    temas.forEach(temaItem=>{
      resumen+=`TEMA: ${temaItem}\n`;
      // Clases del tema
      const clases=getClasesDelTema(temaItem);
      let tp=0,tc=0,tpos=0,tneg=0;
      clases.forEach(clave=>{
        const r=getRegAlumno(clave);
        if(r.presencia){tc++;if(r.presencia==="P"||r.presencia==="J")tp++;}
        if(r.desempeno==="+")tpos++;else if(r.desempeno==="-")tneg++;
      });
      if(tc>0)resumen+=`  Asistencia: ${Math.round((tp/tc)*100)}% (${tp}/${tc} clases), Desempeño positivo: ${tpos}, negativo: ${tneg}\n`;
      // Exámenes
      const tipos=getTiposEval(temaItem);
      tipos.forEach(tipo=>{
        const ex=getEx(temaItem,tipo);
        if(ex.nota)resumen+=`  ${tipo}: ${ex.nota}/10 ${Number(ex.nota)>=7?"(Aprobado)":"(Desaprobado)"}\n`;
        else if(ex.estado)resumen+=`  ${tipo}: ${ex.estado==="ausente"?"Ausente":"No rindió"}\n`;
      });
      // Entregas
      const ents=getEntregasTema(temaItem);
      if(ents.length>0){
        ents.forEach(e=>{
          if(e.tarea)resumen+=`  Tarea${e.sub?" ("+e.sub+")":""}: ${e.tarea}\n`;
          if(e.tp!=null)resumen+=`  T.P.${e.sub?" ("+e.sub+")":""}: ${e.tp}%\n`;
        });
      }
      resumen+="\n";
    });

    // Agregar observaciones al resumen
    if(observaciones.length>0){
      resumen+="OBSERVACIONES REGISTRADAS:\n";
      observaciones.forEach((obs,i)=>{
        resumen+=`  ${i+1}. [${obs.tipo}] ${obs.fecha} - ${obs.motivo||""}\n  ${obs.texto}\n`;
      });
      resumen+="\n";
    }

    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",max_tokens:1000,
          messages:[{role:"user",content:`Sos el Ing. Josemaría Seré, docente de Matemáticas del Colegio Los Molinos.
Redactá un mail formal en español dirigido al tutor del alumno ${alumno.nombre} del curso ${curso.nombre}.
El mail debe informar la situación académica del alumno de forma clara, constructiva y profesional.
Incluí los datos relevantes del resumen. Destacá tanto los logros como las áreas de mejora.
Cerrá con una invitación a comunicarse si tiene dudas.
NO uses markdown, solo texto plano. NO uses asteriscos ni guiones como viñetas.
Empezá directamente con "Estimado/a tutor/a de ${alumno.nombre}:" sin asunto ni encabezado.

RESUMEN DEL ALUMNO:
${resumen}`}]
        })
      });
      const data=await resp.json();
      const cuerpo=data.content?.find(b=>b.type==="text")?.text||"";
      const asunto=`Informe académico - ${alumno.nombre} - ${curso.nombre} - Matemáticas 2026`;
      setMailPreview({asunto,cuerpo,email:emailTutor});
      setGenerandoMail(false);
    }catch(e){
      setErrMail("Error al generar el mail: "+e.message);
      setGenerandoMail(false);
    }
  }

  function abrirEnGmail(){
    if(!mailPreview)return;
    const params=new URLSearchParams({
      to:mailPreview.email,
      su:mailPreview.asunto,
      body:mailPreview.cuerpo
    });
    window.open(`https://mail.google.com/mail/?view=cm&fs=1&${params.toString()}`,"_blank");
  }

  function imprimir(){
    const el=document.getElementById("ficha-print-area");
    if(!el)return;
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ficha — ${alumno.nombre}</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0;}
      body{font-family:system-ui,sans-serif;color:#111;padding:20px;font-size:11px;}
      h1{font-size:17px;color:#1a3a5c;margin-bottom:3px;}
      h2{font-size:12px;color:#1a3a5c;margin:14px 0 5px;border-bottom:2px solid #1a3a5c;padding-bottom:2px;}
      .meta{font-size:10px;color:#666;margin-bottom:14px;}
      .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
      .stat{background:#f5f7fa;border-radius:5px;padding:7px;text-align:center;}
      .stat-val{font-size:18px;font-weight:700;}
      .stat-lbl{font-size:9px;color:#666;}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
      .box{background:#f5f7fa;border-radius:6px;padding:8px 10px;}
      table{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10px;}
      th{background:#1a3a5c;color:#fff;padding:4px 7px;text-align:center;font-size:9px;}
      td{padding:3px 7px;border:1px solid #ddd;text-align:center;}
      tr:nth-child(even)td{background:#f8f8f8;}
      .obs{border-left:3px solid #2c6fad;padding:6px 10px;margin-bottom:6px;background:#f0f4f8;border-radius:0 6px 6px 0;}
      .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:700;}
      .footer{margin-top:14px;padding-top:8px;border-top:1px solid #ddd;font-size:9px;color:#888;display:flex;justify-content:space-between;}
      @page{size:A4;margin:1.5cm;}
      @media print{body{padding:0;}}
    </style></head>
    <body>${el.innerHTML}
    <script>window.onload=function(){window.print();}<\/script>
    </body></html>`;
    const w=window.open("","_blank");
    if(w){w.document.write(html);w.document.close();}
    else{
      // Fallback: blob download
      const blob=new Blob([html],{type:"text/html"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;a.download=`Ficha_${alumno.nombre.replace(/[^a-zA-Z0-9]/g,"_")}.html`;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }
  }

  return(
    <div>
      {/* BOTONES ACCIÓN */}
      <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <button onClick={imprimir} style={{background:C.azul,color:C.blanco,border:"none",borderRadius:8,padding:"9px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
          🖨️ Imprimir / Exportar PDF
        </button>
        <button onClick={()=>{setMailPreview(null);setErrMail("");document.getElementById("mail-panel").style.display=document.getElementById("mail-panel").style.display==="none"?"block":"none";}}
          style={{background:C.amarilloBg,color:C.amarillo,border:`2px solid ${C.amarillo}`,borderRadius:8,padding:"9px 16px",fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
          ✉️ Enviar mail al tutor
        </button>
      </div>

      {/* PANEL MAIL */}
      <div id="mail-panel" style={{display:"none",marginBottom:16}}>
        <div style={{background:C.blanco,border:`1px solid ${C.grisBorde}`,borderRadius:12,padding:"16px"}}>
          <div style={{fontSize:13,fontWeight:700,color:C.azul,marginBottom:12}}>Mail al tutor de {alumno.nombre}</div>

          {/* EMAIL TUTOR */}
          <div style={{marginBottom:12}}>
            {tutorInfo&&(
              <div style={{background:C.verdeBg,border:`1px solid ${C.verde}`,borderRadius:8,padding:"8px 12px",marginBottom:8,fontSize:12,display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontWeight:700,color:C.verde}}>👤</span>
                <span style={{color:C.texto}}><strong>{tutorInfo.nombre}</strong>{tutorInfo.email?` · ${tutorInfo.email}`:""}</span>
              </div>
            )}
            <div style={{fontSize:11,color:C.gris,marginBottom:4,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Email del tutor</div>
            <input type="email" value={emailTutor} onChange={e=>setEmailTutor(e.target.value)}
              placeholder="tutor@ejemplo.com"
              style={{width:"100%",height:36,padding:"0 12px",border:`1px solid ${C.grisBorde}`,borderRadius:8,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
          </div>

          <button onClick={generarMail} disabled={generandoMail||!emailTutor.trim()}
            style={{background:generandoMail||!emailTutor.trim()?C.gris:C.azul,color:C.blanco,border:"none",borderRadius:8,padding:"9px 16px",fontSize:13,fontWeight:700,cursor:generandoMail||!emailTutor.trim()?"not-allowed":"pointer",marginBottom:12,display:"flex",alignItems:"center",gap:6}}>
            {generandoMail?"⏳ Generando mail...":"✨ Generar borrador"}
          </button>

          {errMail&&<div style={{background:C.rojoBg,border:`1px solid ${C.rojo}`,borderRadius:8,padding:"8px 12px",color:C.rojo,fontSize:12,marginBottom:10}}>{errMail}</div>}

          {/* PREVIEW DEL MAIL */}
          {mailPreview&&(
            <div>
              <div style={{background:C.fondo,borderRadius:8,padding:"12px 14px",marginBottom:10}}>
                <div style={{fontSize:11,color:C.gris,marginBottom:4,fontWeight:700}}>ASUNTO</div>
                <div style={{fontSize:13,fontWeight:600,color:C.texto,marginBottom:12}}>{mailPreview.asunto}</div>
                <div style={{fontSize:11,color:C.gris,marginBottom:4,fontWeight:700}}>CUERPO</div>
                <textarea value={mailPreview.cuerpo} onChange={e=>setMailPreview({...mailPreview,cuerpo:e.target.value})}
                  style={{width:"100%",minHeight:200,padding:"10px",fontSize:12,border:`1px solid ${C.grisBorde}`,borderRadius:8,resize:"vertical",lineHeight:1.7,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
                <div style={{fontSize:11,color:C.gris,marginTop:4}}>Podés editar el texto antes de enviarlo.</div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={abrirEnGmail}
                  style={{flex:2,background:"#EA4335",color:C.blanco,border:"none",borderRadius:8,padding:"10px 16px",fontSize:13,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>
                  Abrir en Gmail
                </button>
                <button onClick={()=>setMailPreview(null)}
                  style={{flex:1,background:C.fondo,border:`1px solid ${C.grisBorde}`,borderRadius:8,padding:"10px",fontSize:13,color:C.gris,cursor:"pointer"}}>
                  Descartar
                </button>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ÁREA IMPRIMIBLE */}
      <div id="ficha-print-area">

        {/* ENCABEZADO */}
        <h1 style={{fontSize:20,fontWeight:800,color:C.azul,marginBottom:2}}>{alumno.nombre}</h1>
        <div className="meta" style={{fontSize:12,color:C.gris,marginBottom:16}}>
          Colegio Los Molinos · {curso.nombre} · Matemáticas 2026 · Ficha generada el {hoy}
        </div>

        {/* RESUMEN GLOBAL */}
        <h2 style={{fontSize:13,fontWeight:700,color:C.azul,marginTop:0,marginBottom:8,borderBottom:`2px solid ${C.azul}`,paddingBottom:4}}>Resumen general</h2>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:10}}>
          {[
            {lbl:"Asistencia global",val:pctGlobal!==null?`${pctGlobal}%`:"—",sub:`${totPresente}/${totClases} clases`,col:pctGlobal===null?C.gris:pctGlobal>=75?C.verde:C.rojo},
            {lbl:"Parcialitos aprobados",val:(()=>{
              let apro=0,total=0;
              Object.entries(registros).forEach(([k,r])=>{
                if(!k.startsWith(cursoKey+"__"))return;
                const reg=r[alumno.id];
                if(reg&&reg.parcialito){total++;if(reg.parcialito==="B"||reg.parcialito==="B-")apro++;}
              });
              return total>0?`${apro}/${total}`:"—";
            })(),sub:"B o B- sobre total",col:C.azulMedio},
            {lbl:"Temas aprobados",val:temas.filter(t=>getTiposEval(t).some(tp=>{const ex=getEx(t,tp);return ex.nota&&Number(ex.nota)>=7;})).length+"/"+temas.length,sub:"nota ≥ 7",col:C.verde},
          ].map((s,i)=>(
            <div key={i} style={{background:C.fondo,borderRadius:10,padding:"12px",textAlign:"center"}}>
              <div style={{fontSize:22,fontWeight:800,color:s.col}}>{s.val}</div>
              <div style={{fontSize:11,color:C.gris,marginTop:2}}>{s.lbl}</div>
              <div style={{fontSize:10,color:C.gris}}>{s.sub}</div>
            </div>
          ))}
        </div>

        {/* DESEMPEÑO Y ENTREGAS GLOBALES */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          {/* DESEMPEÑO */}
          <div style={{background:C.fondo,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:C.gris,marginBottom:8}}>Desempeño en clase</div>
            {(()=>{
              let pos=0,neg=0,igu=0;
              Object.entries(registros).forEach(([k,r])=>{
                if(!k.startsWith(cursoKey+"__"))return;
                const reg=r[alumno.id];
                if(reg?.desempeno==="+")pos++;
                else if(reg?.desempeno==="-")neg++;
                else if(reg?.desempeno==="=")igu++;
              });
              const total=pos+neg+igu;
              if(total===0)return <div style={{fontSize:11,color:C.gris}}>Sin registros</div>;
              return(<div>
                <div style={{display:"flex",gap:6,marginBottom:8}}>
                  {pos>0&&<div style={{textAlign:"center",background:C.verdeBg,borderRadius:8,padding:"6px 10px"}}>
                    <div style={{fontSize:18,fontWeight:800,color:C.verde}}>+{pos}</div>
                    <div style={{fontSize:9,color:C.verde}}>Bien</div>
                  </div>}
                  {igu>0&&<div style={{textAlign:"center",background:C.azulClaro,borderRadius:8,padding:"6px 10px"}}>
                    <div style={{fontSize:18,fontWeight:800,color:C.azulMedio}}>{igu}</div>
                    <div style={{fontSize:9,color:C.azulMedio}}>Normal</div>
                  </div>}
                  {neg>0&&<div style={{textAlign:"center",background:C.rojoBg,borderRadius:8,padding:"6px 10px"}}>
                    <div style={{fontSize:18,fontWeight:800,color:C.rojo}}>−{neg}</div>
                    <div style={{fontSize:9,color:C.rojo}}>No trabajó</div>
                  </div>}
                </div>
                <div style={{height:8,borderRadius:4,background:"#eee",overflow:"hidden",display:"flex"}}>
                  {pos>0&&<div style={{flex:pos,background:C.verde}}/>}
                  {igu>0&&<div style={{flex:igu,background:C.azulMedio}}/>}
                  {neg>0&&<div style={{flex:neg,background:C.rojo}}/>}
                </div>
              </div>);
            })()}
          </div>
          {/* ENTREGAS */}
          <div style={{background:C.fondo,borderRadius:10,padding:"12px"}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:C.gris,marginBottom:8}}>Entregas</div>
            {(()=>{
              let tareasT=0,tareasA=0,tpsT=0,tpsA=0;
              Object.entries(entregas).forEach(([clave,reg])=>{
                if(!clave.startsWith(cursoKey+"__"))return;
                const e=reg[alumno.id];if(!e)return;
                if(e.tarea!==undefined&&e.tarea!==null){tareasT++;if(e.tarea==="B"||e.tarea==="B-")tareasA++;}
                if(e.tp!=null){tpsT++;if(e.tp>=60)tpsA++;}
              });
              if(tareasT===0&&tpsT===0)return <div style={{fontSize:11,color:C.gris}}>Sin entregas</div>;
              return(<div style={{display:"flex",gap:10}}>
                {tareasT>0&&<div style={{textAlign:"center"}}>
                  <div style={{fontSize:16,fontWeight:800,color:C.azul}}>{tareasA}/{tareasT}</div>
                  <div style={{fontSize:10,color:C.gris}}>Tareas aprobadas</div>
                </div>}
                {tpsT>0&&<div style={{textAlign:"center"}}>
                  <div style={{fontSize:16,fontWeight:800,color:C.purpura}}>{tpsA}/{tpsT}</div>
                  <div style={{fontSize:10,color:C.gris}}>T.P. aprobados (≥60%)</div>
                </div>}
              </div>);
            })()}
          </div>
        </div>

        {/* TABLA POR TEMA */}
        {temas.map(temaItem=>{
          const clases=getClasesDelTema(temaItem);
          const entregasTema=getEntregasTema(temaItem);
          const tiposEval=getTiposEval(temaItem);
          let tPres=0,tClas=0,tPos=0,tNeg=0,tIgu=0;
          clases.forEach(clave=>{
            const r=getRegAlumno(clave);
            if(r.presencia){tClas++;if(r.presencia==="P")tPres++;if(r.presencia==="J")tPres++;}
            if(r.desempeno==="+")tPos++;else if(r.desempeno==="-")tNeg++;else if(r.desempeno==="=")tIgu++;
          });
          const pctTema=tClas>0?Math.round((tPres/tClas)*100):null;

          return(
            <div key={temaItem} style={{marginBottom:16}}>
              <h2 style={{fontSize:13,fontWeight:700,color:C.azul,marginBottom:8,borderBottom:`2px solid ${C.azul}`,paddingBottom:4}}>{temaItem}</h2>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:10}}>

                {/* ASISTENCIA Y DESEMPEÑO */}
                <div style={{background:C.fondo,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:C.gris,marginBottom:6}}>Asistencia en clases del tema</div>
                  {tClas===0
                    ?<div style={{fontSize:12,color:C.gris}}>Sin clases registradas</div>
                    :<div>
                      <div style={{fontSize:20,fontWeight:800,color:pctTema>=75?C.verde:C.rojo}}>{pctTema}%</div>
                      <div style={{fontSize:11,color:C.gris}}>{tPres}/{tClas} clases presentes</div>
                      <div style={{marginTop:6,display:"flex",gap:8}}>
                        {tPos>0&&<span style={{fontSize:11,background:C.verdeBg,color:C.verde,padding:"2px 7px",borderRadius:10,fontWeight:700}}>+ {tPos}</span>}
                        {tIgu>0&&<span style={{fontSize:11,background:C.azulClaro,color:C.azulMedio,padding:"2px 7px",borderRadius:10,fontWeight:700}}>= {tIgu}</span>}
                        {tNeg>0&&<span style={{fontSize:11,background:C.rojoBg,color:C.rojo,padding:"2px 7px",borderRadius:10,fontWeight:700}}>− {tNeg}</span>}
                      </div>
                    </div>
                  }
                </div>

                {/* EXÁMENES */}
                <div style={{background:C.fondo,borderRadius:8,padding:"10px 12px"}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:C.gris,marginBottom:6}}>Evaluaciones</div>
                  {tiposEval.map((tipo,ti)=>{
                    const ex=getEx(temaItem,tipo);
                    const nota=ex.nota;const estado=ex.estado;
                    const ap=nota&&Number(nota)>=7;
                    let display,col;
                    if(nota){display=nota;col=ap?C.verde:C.rojo;}
                    else if(estado==="ausente"){display="Ausente";col=C.rojo;}
                    else if(estado==="no_rindio"){display="No rindió";col=C.amarillo;}
                    else{display="—";col=C.gris;}
                    return(
                      <div key={ti} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                        <span style={{fontSize:11,color:C.gris,flex:1}}>{tipo}</span>
                        <span style={{fontSize:14,fontWeight:800,color:col}}>{display}</span>
                        {nota&&<span style={{fontSize:12}}>{ap?"✅":"❌"}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* ENTREGAS */}
              {entregasTema.length>0&&(
                <div style={{marginBottom:8}}>
                  <div style={{fontSize:10,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:C.gris,marginBottom:6}}>Entregas</div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                    <thead>
                      <tr>
                        <th style={thS}>Subtema</th>
                        <th style={thS}>Tarea</th>
                        <th style={thS}>T.P.</th>
                      </tr>
                    </thead>
                    <tbody>
                      {entregasTema.map((ent,ei)=>(
                        <tr key={ei} style={{background:ei%2===0?C.blanco:C.fondo}}>
                          <td style={{...tdS,textAlign:"left"}}>{ent.sub||"—"}</td>
                          <td style={{...tdS,fontWeight:700,color:ent.tarea?C.azul:C.gris}}>{ent.tarea||"—"}</td>
                          <td style={{...tdS,fontWeight:700,color:ent.tp!=null?C.purpura:C.gris}}>{ent.tp!=null?`${ent.tp}%`:"—"}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {/* DETALLE CLASES */}
              {clases.length>0&&(
                <details style={{marginTop:4}}>
                  <summary style={{fontSize:11,color:C.azulMedio,cursor:"pointer",userSelect:"none"}}>Ver detalle clase por clase ({clases.length} clases)</summary>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:8}}>
                    {clases.map((clave,ci)=>{
                      const r=getRegAlumno(clave);
                      const fecha=clave.split("__")[2]||"";
                      const [y,m,d]=fecha.split("-");
                      const p=r.presencia;const des=r.desempeno;
                      const bgC=p==="P"?C.verdeBg:p==="A"?C.rojoBg:p==="J"?C.amarilloBg:C.fondo;
                      const colC=p==="P"?C.verde:p==="A"?C.rojo:p==="J"?C.amarillo:C.gris;
                      return(
                        <div key={ci} style={{textAlign:"center",background:bgC,borderRadius:6,padding:"4px 6px",minWidth:44}}>
                          <div style={{fontSize:9,color:colC}}>{d}/{m}</div>
                          <div style={{fontSize:11,fontWeight:700,color:colC}}>{p==="P"?"P":p==="A"?"A":p==="J"?"J":"—"}</div>
                          {des&&<div style={{fontSize:10,fontWeight:700,color:des==="+"?C.verde:des==="-"?C.rojo:C.azulMedio}}>{des}</div>}
                        </div>
                      );
                    })}
                  </div>
                </details>
              )}
            </div>
          );
        })}

        {/* GRÁFICO DE NOTAS EN EL TIEMPO */}
        {(()=>{
          // Recopilar todos los exámenes con nota y fecha, ordenados por fecha
          const puntos=[];
          temas.forEach(temaItem=>{
            getTiposEval(temaItem).forEach(tipo=>{
              const ex=getEx(temaItem,tipo);
              const clave=`${cursoKey}__${temaItem}__${tipo}`;
              const fechaISO=exFechas[clave]||"";
              if(ex.nota){
                puntos.push({
                  label:`${temaItem} — ${tipo}`,
                  nota:Number(ex.nota),
                  fechaISO,
                  fechaDisplay:fechaISO?formatFecha(fechaISO):tipo
                });
              }
            });
          });
          // Ordenar por fecha
          puntos.sort((a,b)=>a.fechaISO.localeCompare(b.fechaISO));
          if(puntos.length<2)return null;

          // Tendencia basada SIEMPRE en los últimos 2 exámenes
          const ult2=[puntos[puntos.length-2],puntos[puntos.length-1]];
          const delta=ult2[1].nota-ult2[0].nota;
          const tendDir=delta>0?"↑ Subiendo":delta<0?"↓ Bajando":"→ Estable";
          const tendCol=delta>0?C.verde:delta<0?C.rojo:C.amarillo;
          // Intensidad relativa: comparada con escala 0-10
          const intensAbs=Math.abs(delta);
          const intensLbl=intensAbs>=4?"Muy marcada":intensAbs>=2?"Marcada":intensAbs>=1?"Moderada":"Leve";

          // SVG
          const n=puntos.length;
          const W=260,H=120,PAD=24,PADB=28;
          const maxN=10,minN=1;
          const xStep=(W-PAD*2)/(n-1||1);
          const yScale=(H-PAD-PADB)/(maxN-minN);
          const toX=(i)=>PAD+i*xStep;
          const toY=(v)=>H-PADB-(v-minN)*yScale;
          const path=puntos.map((p,i)=>`${i===0?"M":"L"}${toX(i).toFixed(1)},${toY(p.nota).toFixed(1)}`).join(" ");
          const areaPath=`${path} L${toX(n-1).toFixed(1)},${(H-PADB).toFixed(1)} L${toX(0).toFixed(1)},${(H-PADB).toFixed(1)} Z`;

          return(
            <div style={{marginBottom:16}}>
              <h2 style={{fontSize:13,fontWeight:700,color:C.azul,marginBottom:8,borderBottom:`2px solid ${C.azul}`,paddingBottom:4}}>Evolución de notas</h2>
              <div style={{display:"flex",gap:12,alignItems:"stretch",flexWrap:"wrap"}}>
                {/* GRÁFICO */}
                <div style={{flex:2,minWidth:220,background:C.fondo,borderRadius:10,padding:"12px"}}>
                  <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
                    {/* Grillas */}
                    {[1,4,7,10].map(v=>(
                      <g key={v}>
                        <line x1={PAD} y1={toY(v)} x2={W-PAD} y2={toY(v)} stroke="#ddd" strokeWidth="0.5"/>
                        <text x={PAD-4} y={toY(v)+3} fontSize="8" fill="#aaa" textAnchor="end">{v}</text>
                      </g>
                    ))}
                    {/* Línea aprobación */}
                    <line x1={PAD} y1={toY(7)} x2={W-PAD} y2={toY(7)} stroke={C.verde} strokeWidth="1" strokeDasharray="3,2" opacity="0.5"/>
                    <text x={W-PAD+2} y={toY(7)+3} fontSize="7" fill={C.verde}>7</text>
                    {/* Área */}
                    <path d={areaPath} fill={slope>=0?"rgba(26,124,62,0.08)":"rgba(192,57,43,0.08)"}/>
                    {/* Línea */}
                    <path d={path} fill="none" stroke={slope>=0?C.verde:C.rojo} strokeWidth="2" strokeLinejoin="round"/>
                    {/* Puntos */}
                    {puntos.map((p,i)=>(
                      <g key={i}>
                        <circle cx={toX(i)} cy={toY(p.nota)} r="4" fill={p.nota>=7?C.verde:C.rojo} stroke="white" strokeWidth="1.5"/>
                        <text x={toX(i)} y={toY(p.nota)-7} fontSize="9" fill={p.nota>=7?C.verde:C.rojo} textAnchor="middle" fontWeight="700">{p.nota}</text>
                        <text x={toX(i)} y={H-4} fontSize="7" fill="#888" textAnchor="middle">{p.fechaDisplay}</text>
                      </g>
                    ))}
                  </svg>
                </div>
                {/* TENDENCIA */}
                <div style={{flex:1,minWidth:130,background:C.fondo,borderRadius:10,padding:"14px",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center"}}>
                  <div style={{fontSize:10,color:C.gris,marginBottom:4}}>Últimos 2 exámenes</div>
                  <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
                    <div style={{fontSize:18,fontWeight:800,color:ult2[0].nota>=7?C.verde:C.rojo}}>{ult2[0].nota}</div>
                    <div style={{fontSize:20,color:tendCol}}>→</div>
                    <div style={{fontSize:18,fontWeight:800,color:ult2[1].nota>=7?C.verde:C.rojo}}>{ult2[1].nota}</div>
                  </div>
                  <div style={{fontSize:28,fontWeight:800,color:tendCol,marginBottom:4}}>{tendDir.split(" ")[0]}</div>
                  <div style={{fontSize:12,fontWeight:700,color:tendCol,marginBottom:8}}>{tendDir.split(" ").slice(1).join(" ")}</div>
                  <div style={{background:"white",borderRadius:8,padding:"8px 12px",width:"100%",marginBottom:6}}>
                    <div style={{fontSize:10,color:C.gris,marginBottom:2}}>Variación</div>
                    <div style={{fontSize:16,fontWeight:800,color:tendCol}}>{delta>=0?"+":""}{delta.toFixed(1)} pts</div>
                  </div>
                  <div style={{background:"white",borderRadius:8,padding:"8px 12px",width:"100%"}}>
                    <div style={{fontSize:10,color:C.gris,marginBottom:2}}>Intensidad</div>
                    <div style={{fontSize:13,fontWeight:700,color:tendCol}}>{intensLbl}</div>
                  </div>
                </div>
              </div>
            </div>
          );
        })()}

        {/* RADAR DE HABILIDADES */}
        <div style={{marginBottom:16}}>
          <h2 style={{fontSize:13,fontWeight:700,color:C.azul,marginBottom:8,borderBottom:`2px solid ${C.azul}`,paddingBottom:4}}>
            Habilidades matemáticas
          </h2>

          {/* CARGAR DESDE DRIVE */}
          {!radarHist&&(
            <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
              <button onClick={cargarRadarDrive} disabled={radarCargando}
                style={{background:radarCargando?C.gris:C.azulClaro,color:radarCargando?C.blanco:C.azul,border:`1px solid ${C.azul}`,borderRadius:8,padding:"8px 14px",fontSize:12,fontWeight:700,cursor:radarCargando?"not-allowed":"pointer"}}>
                {radarCargando?"⏳ Cargando...":"☁️ Cargar historial de Drive"}
              </button>
            </div>
          )}

          {/* INFO: cargar desde solapa exámenes */}
          {radarHist!==null&&(
            <div style={{background:C.azulClaro,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.azulMedio}}>
              💡 Para actualizar las habilidades, subí el PDF del examen desde la solapa <strong>Exámenes</strong> → botón "🧠 Analizar habilidades del curso".
            </div>
          )}

          {/* RADAR DEL ALUMNO */}
          {(()=>{
            if(!radarHist) return <div style={{fontSize:12,color:C.gris,fontStyle:"italic"}}>Cargá el historial de Drive para ver las habilidades.</div>;
            const alumnoNombre=alumno.nombre;

            // Normalizar nombre para comparación
            function norm(n){
              return n.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
                .replace(/[^a-z0-9\s]/g,"")
                .replace(/\s+/g," ").trim();
            }
            // Distancia de Levenshtein entre dos strings
            function lev(a,b){
              const m=a.length,n=b.length;
              const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
              for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
                dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
              return dp[m][n];
            }
            function apellidoMatch(n1,n2){
              const a=norm(n1); const b=norm(n2);
              if(a===b)return true;
              // Distancia total entre nombres normalizados
              if(lev(a,b)<=3)return true;
              // Comparar primer apellido con tolerancia
              const pa=a.split(" ")[0]; const pb=b.split(" ")[0];
              if(pa.length>3&&pb.length>3&&lev(pa,pb)<=2)return true;
              // Palabras compartidas
              const wa=new Set(a.split(" ").filter(w=>w.length>2));
              const wb=b.split(" ").filter(w=>w.length>2);
              const shared=wb.filter(w=>{
                if(wa.has(w))return true;
                // Palabra con tolerancia de 1 caracter
                for(const wa2 of wa)if(w.length>3&&lev(w,wa2)<=1)return true;
                return false;
              });
              return shared.length>=2;
            }

            // Buscar todas las instancias donde aparece este alumno
            const instanciasAlumno=[];
            Object.entries(radarHist).forEach(([key,entry])=>{
              if(!entry.cursoKey||entry.cursoKey!==cursoKey)return;
              entry.instancias.forEach(inst=>{
                const al=inst.alumnos?.find(a=>apellidoMatch(a.nombre,alumnoNombre));
                if(al)instanciasAlumno.push({tema:entry.tema,tipo:inst.tipo,fecha:inst.fecha,skills:al.skills,nota:al.nota,fortalezas:al.fortalezas,debilidades:al.debilidades,nombreEnPDF:al.nombre});
              });
            });
            if(instanciasAlumno.length===0){
              // Mostrar nombres disponibles en el historial para diagnosticar
              const nombresEnHistorial=[];
              Object.entries(radarHist).forEach(([key,entry])=>{
                if(!entry.cursoKey||entry.cursoKey!==cursoKey)return;
                entry.instancias.forEach(inst=>{
                  inst.alumnos?.forEach(a=>{if(!nombresEnHistorial.includes(a.nombre))nombresEnHistorial.push(a.nombre);});
                });
              });
              return(<div>
                <div style={{fontSize:12,color:C.gris,fontStyle:"italic",marginBottom:8}}>Sin datos de habilidades para este alumno aún.</div>
                {nombresEnHistorial.length>0&&(<details style={{marginTop:4}}>
                  <summary style={{fontSize:11,color:C.azulMedio,cursor:"pointer"}}>Ver nombres detectados en el PDF ({nombresEnHistorial.length})</summary>
                  <div style={{background:C.fondo,borderRadius:8,padding:"8px 12px",marginTop:6,fontSize:11,color:C.texto,lineHeight:1.8}}>
                    <div style={{fontWeight:700,marginBottom:4}}>En la app: <span style={{color:C.azul}}>{alumnoNombre}</span></div>
                    <div style={{fontWeight:700,marginBottom:4}}>En el PDF:</div>
                    {nombresEnHistorial.map((n,i)=><div key={i} style={{color:C.gris}}>{n}</div>)}
                  </div>
                </details>)}
              </div>);
            }

            // Obtener skills del curso
            const skillDefs=[
              {id:"calc",nom:"Cálculo",ico:"🔢"},{id:"ecua",nom:"Ecuaciones",ico:"⚖️"},
              {id:"conc",nom:"Conceptual",ico:"📐"},{id:"mode",nom:"Modelado",ico:"📊"},
              {id:"proc",nom:"Procedimiento",ico:"🧩"},{id:"razo",nom:"Razonamiento",ico:"🎲"},
              {id:"graf",nom:"Graficación",ico:"📊"},{id:"lim",nom:"Límites",ico:"⚖️"},
              {id:"opt",nom:"Optimización",ico:"🎯"},{id:"oper",nom:"Operatoria",ico:"🔢"},
              {id:"sist",nom:"Sistemas",ico:"⚖️"},{id:"geom",nom:"Geometría",ico:"📏"},
              {id:"abst",nom:"Razon. abstracto",ico:"🎲"}
            ];
            // Detectar qué skills tiene el alumno
            const skillIds=Object.keys(instanciasAlumno[0].skills||{});
            const skills=skillDefs.filter(s=>skillIds.includes(s.id));
            if(skills.length===0) return null;

            // Ordenar por fecha para mostrar evolución correcta
            instanciasAlumno.sort((a,b)=>a.fecha.localeCompare(b.fecha));
            const ultima=instanciasAlumno[instanciasAlumno.length-1];
            const anterior=instanciasAlumno.length>1?instanciasAlumno[instanciasAlumno.length-2]:null;

            return(<div>
              {/* NOMBRE EN PDF SI DIFIERE */}
              {instanciasAlumno[0]?.nombreEnPDF&&norm(instanciasAlumno[0].nombreEnPDF)!==norm(alumnoNombre)&&(
                <div style={{background:C.amarilloBg,border:`1px solid ${C.amarillo}`,borderRadius:8,padding:"6px 12px",fontSize:11,color:C.amarillo,marginBottom:8}}>
                  ⚠️ Encontrado en el PDF como: <strong>{instanciasAlumno[0].nombreEnPDF}</strong>
                </div>
              )}
              {/* RESUMEN INSTANCIAS */}
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
                {instanciasAlumno.map((inst,i)=>{
                  const nc=inst.nota>=7?C.verde:inst.nota>=5?C.amarillo:C.rojo;
                  const nb=inst.nota>=7?C.verdeBg:inst.nota>=5?C.amarilloBg:C.rojoBg;
                  const esUltima=i===instanciasAlumno.length-1;
                  return(<div key={i} style={{background:nb,borderRadius:8,padding:"6px 12px",textAlign:"center",border:esUltima?`2px solid ${nc}`:"none",position:"relative"}}>
                    {esUltima&&<div style={{position:"absolute",top:-8,left:"50%",transform:"translateX(-50%)",background:nc,color:C.blanco,borderRadius:10,padding:"1px 6px",fontSize:9,fontWeight:700,whiteSpace:"nowrap"}}>último</div>}
                    <div style={{fontSize:10,color:nc,fontWeight:700}}>{inst.tipo}</div>
                    <div style={{fontSize:10,color:C.gris}}>{inst.fecha}</div>
                    {inst.nota&&<div style={{fontSize:18,fontWeight:800,color:nc}}>{inst.nota}/10</div>}
                    <button onClick={()=>{
                      // Eliminar SOLO esta instancia por índice global
                    const newHist=JSON.parse(JSON.stringify(radarHist));
                    // Encontrar la entrada y el índice exacto de esta instancia
                    Object.keys(newHist).forEach(k=>{
                      const entry=newHist[k];
                      const idx=entry.instancias.findIndex(ins=>
                        ins.tipo===inst.tipo&&ins.fecha===inst.fecha&&
                        ins.alumnos?.some(a=>apellidoMatch(a.nombre,alumnoNombre))
                      );
                      if(idx!==-1)entry.instancias.splice(idx,1);
                    });
                    setRadarHist(newHist);
                    try{window.storage.set("radar_historial",JSON.stringify(newHist));}catch(e){}
                  }} style={{marginTop:4,background:"none",border:"none",cursor:"pointer",fontSize:10,color:C.gris,textDecoration:"underline"}}>
                      eliminar
                    </button>
                  </div>);
                })}
              </div>

              {/* REGLA DE NIVELES */}
              <div style={{display:"flex",gap:2,marginBottom:10,flexWrap:"wrap"}}>
                {[
                  {lbl:"Muy bajo",rng:"0-40",col:"#E24B4A",bg:"#FCEBEB"},
                  {lbl:"Bajo",rng:"40-60",col:"#BA7517",bg:"#FAEEDA"},
                  {lbl:"Medio",rng:"60-70",col:"#b7770d",bg:"#FEF9E7"},
                  {lbl:"Medio-alto",rng:"70-80",col:"#639922",bg:"#EAF3DE"},
                  {lbl:"Alto",rng:"80-90",col:"#1a7c3e",bg:"#D4EFDF"},
                  {lbl:"Muy alto",rng:"90-100",col:"#0d4f27",bg:"#A9DFBF"},
                ].map((n,i)=>(
                  <div key={i} style={{background:n.bg,borderRadius:4,padding:"2px 6px",fontSize:9,color:n.col,fontWeight:700}}>
                    {n.lbl} <span style={{fontWeight:400,opacity:0.7}}>({n.rng})</span>
                  </div>
                ))}
              </div>

              {/* BARRAS DE HABILIDADES CON EVOLUCIÓN */}
              <div style={{marginBottom:12}}>
                {skills.map(s=>{
                  const vAct=ultima.skills[s.id]||0;
                  const vAnt=anterior?anterior.skills[s.id]||0:null;
                  const delta=vAnt!==null?vAct-vAnt:null;
                  const col=vAct>=90?"#0d4f27":vAct>=80?"#1a7c3e":vAct>=70?"#639922":vAct>=60?"#BA7517":vAct>=40?"#E24B4A":"#A32D2D";
                  const dc=delta===null?C.gris:delta>3?C.verde:delta<-3?C.rojo:C.gris;
                  const sym=delta===null?'':delta>3?'↑':delta<-3?'↓':'→';
                  const deltaAbs=delta!==null?Math.abs(delta):0;
                  return(<div key={s.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
                    <div style={{fontSize:11,flex:1,color:C.texto}}>{s.ico} {s.nom}</div>
                    <div style={{flex:2,height:8,background:C.fondo,borderRadius:4,position:"relative"}}>
                      {vAnt!==null&&<div style={{position:"absolute",width:`${vAnt}%`,height:8,borderRadius:4,background:"rgba(0,0,0,0.12)"}}/>}
                      <div style={{width:`${vAct}%`,height:8,borderRadius:4,background:col}}/>
                    </div>
                    <div style={{fontSize:11,fontWeight:700,color:col,minWidth:24}}>{vAct}</div>
                    <div style={{fontSize:11,fontWeight:700,color:dc,minWidth:32,textAlign:"right"}}>{sym}{deltaAbs>0?deltaAbs:""}</div>
                  </div>);
                })}
              </div>

              {/* FORTALEZAS Y TEXTO DE MEJORA */}
              <div style={{marginTop:4}}>
                {ultima.fortalezas?.length>0&&(
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:10,fontWeight:700,color:C.gris,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>✅ Fortalezas</div>
                    <div style={{display:"flex",flexDirection:"column",gap:4}}>
                      {ultima.fortalezas.map((f,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,background:C.verdeBg,borderRadius:8,padding:"6px 12px"}}>
                          <span style={{color:C.verde,fontWeight:700,fontSize:14}}>✓</span>
                          <span style={{fontSize:12,color:C.verde,fontWeight:600}}>{f}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {ultima.debilidades?.length>0&&(
                  <div>
                    <div style={{fontSize:10,fontWeight:700,color:C.gris,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>📌 A reforzar</div>
                    <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
                      {ultima.debilidades.map((d,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,background:C.rojoBg,borderRadius:8,padding:"6px 12px"}}>
                          <span style={{color:C.rojo,fontWeight:700,fontSize:14}}>→</span>
                          <span style={{fontSize:12,color:C.rojo,fontWeight:600}}>{d}</span>
                        </div>
                      ))}
                    </div>
                    {/* TEXTO PERSONALIZADO DE MEJORA */}
                    {ultima.observacion&&(
                      <div style={{background:"#fffbea",border:`1px solid ${C.amarillo}`,borderRadius:10,padding:"12px 14px"}}>
                        <div style={{fontSize:10,fontWeight:700,color:C.amarillo,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>💬 Recomendación</div>
                        <div style={{fontSize:12,color:"#5a4000",lineHeight:1.7}}>{ultima.observacion}</div>
                      </div>
                    )}
                  </div>
                )}
              </div>
                  {/* PÁRRAFO MOTIVADOR */}
                  {ultima.fortalezas?.length>0&&ultima.debilidades?.length>0&&(
                    <div style={{marginTop:12,background:"#fffbea",border:`1px solid ${C.amarillo}`,borderRadius:10,padding:"12px 14px"}}>
                      <div style={{fontSize:10,fontWeight:700,color:C.amarillo,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>
                        💬 Mensaje para {alumno.nombre.split(",")[1]?.trim()||alumno.nombre.split(" ")[0]}
                      </div>
                      <div style={{fontSize:12,color:"#5a4000",lineHeight:1.75}}>
                        {ultima.observacion||
                          `¡Muy bien! Demostrás un sólido dominio en ${ultima.fortalezas.slice(0,2).join(" y ")}${ultima.fortalezas.length>2?", entre otras fortalezas":""}. ` +
                          `Te animamos a poner especial atención en ${ultima.debilidades.slice(0,2).join(" y ")}, donde hay margen para crecer. ` +
                          `¡Seguí adelante con el mismo esfuerzo y lo vas a lograr!`
                        }
                      </div>
                    </div>
                  )}
            </div>);
          })()}
        </div>

        {/* OBSERVACIONES */}
        {observaciones.length>0&&(
          <div style={{marginBottom:16}}>
            <h2 style={{fontSize:13,fontWeight:700,color:C.azul,marginBottom:8,borderBottom:`2px solid ${C.azul}`,paddingBottom:4}}>
              Observaciones registradas ({observaciones.length})
            </h2>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {observaciones.map((obs,i)=>{
                const tipoColor=obs.tipo==="Disciplinaria"?"#854F0B":obs.tipo==="Pedagógica"?"#185FA5":"#3B6D11";
                const tipoBg=obs.tipo==="Disciplinaria"?"#FAEEDA":obs.tipo==="Pedagógica"?"#E6F1FB":"#EAF3DE";
                return(
                  <div key={i} style={{background:C.fondo,borderRadius:8,padding:"10px 14px",borderLeft:`3px solid ${tipoColor}`}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                      <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10,background:tipoBg,color:tipoColor}}>{obs.tipo}</span>
                      <span style={{fontSize:11,color:C.gris}}>{obs.fecha}</span>
                      {obs.motivo&&<span style={{fontSize:11,color:C.texto,fontStyle:"italic"}}>· {obs.motivo}</span>}
                    </div>
                    <div style={{fontSize:12,color:C.texto,lineHeight:1.6}}>{obs.texto}</div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
        {observaciones.length===0&&(
          <div style={{marginBottom:16,padding:"10px 14px",background:C.fondo,borderRadius:8,fontSize:12,color:C.gris,fontStyle:"italic"}}>
            Sin observaciones registradas.
          </div>
        )}

        {/* PIE */}
        <div style={{marginTop:16,paddingTop:12,borderTop:`1px solid ${C.grisBorde}`,fontSize:10,color:C.gris,display:"flex",justifyContent:"space-between"}}>
          <span>Colegio Los Molinos · Matemáticas 2026 · Ing. Josemaría Seré</span>
          <span>Ficha generada el {hoy}</span>
        </div>
      </div>
    </div>
  );
}

// ── PLANILLA MAESTRO ──────────────────────────────────────────────────────────
function PlanillaMaestro({curso, cursoKey, registros, entregas, exNotas, exTipos}){
  const temas = curso.temas;

  function getStatsTema(alumnoId, temaItem){
    let total=0,pres=0,just=0,pos=0,neg=0,igu=0;
    Object.entries(registros).forEach(([k,r])=>{
      if(!k.startsWith(`${cursoKey}__${temaItem}__`))return;
      const x=r[alumnoId]; if(!x||!x.presencia)return;
      total++;
      if(x.presencia==="P")pres++;
      if(x.presencia==="J")just++;
      if(x.desempeno==="+")pos++;
      if(x.desempeno==="-")neg++;
      if(x.desempeno==="=")igu++;
    });
    const pct=total>0?Math.round((pres/total)*100):null;
    return{total,pres,just,pct,pos,neg,igu};
  }

  function getEntregasTema(alumnoId, temaItem){
    const res=[];
    Object.entries(entregas).forEach(([clave,reg])=>{
      if(!clave.startsWith(`${cursoKey}__${temaItem}`))return;
      const e=reg[alumnoId]; if(!e)return;
      const sub=clave.replace(`${cursoKey}__${temaItem}__`,"").replace(`${cursoKey}__${temaItem}`,"");
      res.push({sub:sub||null,tarea:e.tarea||null,tp:e.tp!=null?e.tp:null});
    });
    return res;
  }

  function getEx(alumnoId, temaItem, tipo){
    if(!exNotas||!temaItem||!tipo)return{};
    const clave=`${cursoKey}__${temaItem}__${tipo}`;
    return (exNotas[clave]&&exNotas[clave][alumnoId])||{};
  }

  function getTiposEval(temaItem){
    const clave=`${cursoKey}__${temaItem}`;
    const guardados=exTipos&&exTipos[clave];
    return(Array.isArray(guardados)&&guardados.length>0)?[...guardados]:["Parcial"];
  }

  const columnas=temas.map(temaItem=>{
    const tiposEval=getTiposEval(temaItem);
    // Calcular max tareas y max TPs por separado
    let maxTareas=0, maxTPs=0;
    curso.alumnos.forEach(a=>{
      const ents=getEntregasTema(a.id,temaItem);
      const tareas=ents.filter(e=>e.tarea!=null).length;
      const tps=ents.filter(e=>e.tp!=null).length;
      if(tareas>maxTareas)maxTareas=tareas;
      if(tps>maxTPs)maxTPs=tps;
    });
    return{temaItem,maxTareas,maxTPs,tiposEval};
  });

  const td={padding:"6px 8px",borderRight:`1px solid ${C.grisBorde}`,borderBottom:`1px solid ${C.grisBorde}`,fontSize:10,verticalAlign:"middle",textAlign:"center",whiteSpace:"nowrap"};
  const th={...td,background:C.azul,color:C.blanco,fontWeight:700,fontSize:9,letterSpacing:0.5,textTransform:"uppercase"};
  const thTema={...th,background:C.azulMedio,fontSize:10,letterSpacing:1};
  const thSub={...th,background:"#1e5fa8",minWidth:60};
  const thEnt={...th,background:"#2563ab",minWidth:52};
  const thExam={...th,background:"#1e4d7b",minWidth:48};
  const thRecup={...th,background:"#163d61",minWidth:48};

  return(
    <div style={{overflowX:"auto"}}>
      <div style={{fontSize:11,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.gris,marginBottom:10}}>
        Planilla maestro — {curso.nombre}
      </div>
      <table style={{borderCollapse:"collapse",minWidth:"100%",background:C.blanco,fontSize:10,border:`1px solid ${C.grisBorde}`,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
        <thead>
          <tr>
            <th rowSpan={2} style={{...th,minWidth:130,textAlign:"left",paddingLeft:10,fontSize:10,position:"sticky",left:0,zIndex:3,background:C.azul}}>Alumno</th>
            {columnas.map(({temaItem,maxTareas,maxTPs,tiposEval})=>(
              <th key={temaItem} colSpan={2+maxTareas+maxTPs+tiposEval.length} style={{...thTema,borderLeft:`3px solid ${C.azulClaro}`}}>{temaItem}</th>
            ))}
          </tr>
          <tr>
            {columnas.map(({temaItem,maxTareas,maxTPs,tiposEval})=>[
              <th key={`a${temaItem}`} style={{...thSub,borderLeft:`3px solid ${C.azulClaro}`}}>Asist.</th>,
              <th key={`d${temaItem}`} style={{...thSub,minWidth:50}}>Desempeño</th>,
              ...Array.from({length:maxTareas},(_,i)=>(
                <th key={`t${temaItem}${i}`} style={thEnt}>Tarea {i+1}</th>
              )),
              ...Array.from({length:maxTPs},(_,i)=>(
                <th key={`tp${temaItem}${i}`} style={{...thEnt,background:"#6b21a8"}}>T.P. {i+1}</th>
              )),
              ...tiposEval.map((tipo,ti)=>(
                <th key={`ev${temaItem}${ti}`} style={ti===0?thExam:thRecup}>
                  {tipo.length>8?tipo.substring(0,7)+"…":tipo}
                </th>
              )),
            ])}
          </tr>
        </thead>
        <tbody>
          {curso.alumnos.map((alumno,i)=>{
            const bgRow=i%2===0?C.blanco:"#f8fafc";
            const aprobaTodo=temas.length>0&&temas.every(t=>{
              const tipos=getTiposEval(t);
              return tipos.some(tipo=>{const ex=getEx(alumno.id,t,tipo);return ex.nota&&Number(ex.nota)>=7;});
            });
            const bgFinal=aprobaTodo?"#f0faf4":bgRow;
            return(
              <tr key={alumno.id} style={{background:bgFinal}}>
                <td style={{...td,textAlign:"left",fontWeight:700,color:C.texto,minWidth:130,paddingLeft:10,position:"sticky",left:0,background:bgFinal,zIndex:1}}>
                  <div style={{fontSize:11}}>{alumno.nombre}</div>
                  {aprobaTodo&&<div style={{fontSize:8,color:C.verde,fontWeight:800}}>✅ Todo aprobado</div>}
                </td>
                {columnas.map(({temaItem,maxTareas,maxTPs,tiposEval})=>{
                  const st=getStatsTema(alumno.id,temaItem);
                  const ents=getEntregasTema(alumno.id,temaItem);
                  return[
                    <td key={`a${temaItem}`} style={{...td,borderLeft:`3px solid ${C.azulClaro}`,fontWeight:600,color:st.pct===null?C.gris:st.pct>=75?C.verde:C.rojo}}>
                      {st.pct!==null?`${st.pct}%`:"—"}
                      {st.total>0&&<div style={{fontSize:8,color:C.gris}}>{st.pres}/{st.total}cl</div>}
                    </td>,
                    <td key={`d${temaItem}`} style={{...td}}>
                      {st.total===0
                        ?<span style={{color:C.grisBorde}}>—</span>
                        :<div style={{display:"flex",gap:3,justifyContent:"center"}}>
                          {st.pos>0&&<span style={{fontWeight:700,color:C.verde}}>+{st.pos}</span>}
                          {st.neg>0&&<span style={{fontWeight:700,color:C.rojo}}>-{st.neg}</span>}
                          {st.igu>0&&<span style={{fontWeight:700,color:C.gris}}>={st.igu}</span>}
                          {st.pos===0&&st.neg===0&&st.igu===0&&<span style={{color:C.grisBorde}}>—</span>}
                        </div>
                      }
                    </td>,
                    ...Array.from({length:maxTareas},(_,idx)=>{
                      // Buscar la idx-ésima tarea
                      const tareasAlumno=ents.filter(e=>e.tarea!=null);
                      const ent=tareasAlumno[idx]||null;
                      return(
                        <td key={`t${temaItem}${idx}`} style={{...td}}>
                          {ent
                            ?<span style={{fontWeight:700,color:C.azul}}>{ent.tarea}</span>
                            :<span style={{color:C.grisBorde}}>—</span>
                          }
                        </td>
                      );
                    }),
                    ...Array.from({length:maxTPs},(_,idx)=>{
                      // Buscar el idx-ésimo TP
                      const tpsAlumno=ents.filter(e=>e.tp!=null);
                      const ent=tpsAlumno[idx]||null;
                      return(
                        <td key={`tp${temaItem}${idx}`} style={{...td}}>
                          {ent!=null
                            ?<span style={{fontWeight:700,color:C.purpura}}>{ent.tp}%</span>
                            :<span style={{color:C.grisBorde}}>—</span>
                          }
                        </td>
                      );
